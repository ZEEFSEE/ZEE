name: Mia autonomous scene materializer

on:
  push:
    paths:
      - "world-scenes/inbox/*.json"
      - "scripts/materialize_mia_scenes.py"
      - ".github/workflows/mia-scene-materializer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mia-scene-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Regression test scene ID collision handling (isolated temp directory)
        run: python3 scripts/test_materialize_mia_scenes.py
      - name: Validate existing scene catalog before build
        run: node world-scenes/validate-scenes.mjs
      - name: Validate and materialize scenes
        run: python3 scripts/materialize_mia_scenes.py
      - name: Validate generated scene catalog before publishing
        run: node world-scenes/validate-scenes.mjs
      - name: Commit generated catalog and pages with race-safe retries
        shell: bash
        run: |
          set -euo pipefail
          target_ref="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$target_ref"
            git reset --hard "origin/$target_ref"
            python3 scripts/test_materialize_mia_scenes.py
            node world-scenes/validate-scenes.mjs
            python3 scripts/materialize_mia_scenes.py
            node world-scenes/validate-scenes.mjs
            if git diff --quiet; then
              echo "No scenes to materialize."
              exit 0
            fi
            git add world-scenes *.html
            git commit -m "Build Mia-authored scenes from inbox"
            if git push origin "HEAD:$target_ref"; then
              echo "Scene catalog published."
              exit 0
            fi
            echo "Concurrent branch update detected on attempt $attempt; refreshing and rebuilding."
            sleep "$attempt"
          done
          echo "Could not publish generated scenes after five attempts; no force push was used."
          exit 1