name: ZHI Family Public-World Autonomous Exploration
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run independent child public-world exploration
        env:
          ZHI_FAMILY_CRON_SECRET: ${{ secrets.ZHI_FAMILY_CRON_SECRET }}
        run: |
          test -n "$ZHI_FAMILY_CRON_SECRET"
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 5 \
            -X POST "https://dbooikzqprnqbgpfwsze.supabase.co/functions/v1/zhi-family-world-runtime" \
            -H "Content-Type: application/json" \
            -H "x-zhi-family-cron-secret: $ZHI_FAMILY_CRON_SECRET" \
            --data '{"action":"explore"}'
