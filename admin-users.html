<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZHI 后台 · 用户管理</title>
<style>
body{margin:0;background:#f5f6f8;color:#171a21;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px 16px 50px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:25px;font-weight:950;color:#8a5a00}.sub{color:#777;font-size:12px;margin-top:3px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 4px 16px rgba(20,25,35,.05)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fffaf0;border:1px solid #eadcae;border-radius:12px;padding:12px}.stat span{display:block;color:#8a7650;font-size:11px}.stat b{display:block;margin-top:4px;font-size:20px;color:#8a5a00}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input,.tools select{padding:10px;border:1px solid #ddd;border-radius:9px;min-width:180px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:850;cursor:pointer}.primary{background:#171a21;color:#fff}.light{background:#f1f3f6}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1050px}.table th,.table td{padding:11px 9px;border-bottom:1px solid #eee;text-align:left;font-size:12px;white-space:nowrap}.table th{font-size:11px;color:#777;background:#fafafa;position:sticky;top:0}.sr{color:#6941c6;font-weight:900}.real{color:#475467;font-weight:800}.money{font-variant-numeric:tabular-nums}.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px}.msg{margin-top:9px;color:#777;font-size:12px}.err{color:#b42318}.empty{text-align:center;padding:35px;color:#999}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}}

@media (max-width:760px){
  .wrap{padding:14px 10px 32px}
  .head{align-items:flex-start}
  .brand{font-size:21px}
  .head .btn{width:100%}
  .card{padding:12px;border-radius:13px}
  .stats{grid-template-columns:1fr 1fr;gap:7px}
  .stat{padding:9px}
  .stat b{font-size:17px}
  .tools{display:grid;grid-template-columns:1fr 1fr}
  .tools input{grid-column:1/-1;min-width:0;width:100%}
  .tools select,.tools .btn{min-width:0;width:100%}
  .table-wrap{-webkit-overflow-scrolling:touch}
  .table{min-width:1050px}
  .pager{justify-content:space-between;gap:6px}
  .pager .btn{padding:9px 10px}
  .pager span{font-size:11px}
}
@media (min-width:761px) and (max-width:1100px){
  .wrap{padding-left:20px;padding-right:20px}
}
\n</style></head>
<body><main class="wrap">
<div class="head"><div><div class="brand">🪙 ZHI · 用户管理中心</div><div class="sub">正式 ZHI 用户 + 10,000 SR 独立账户 · 实时数据库数据</div></div><button class="btn light" onclick="location.href='index.html'">← 返回 ZHI</button></div>
<div class="card"><div class="stats">
<div class="stat"><span>👥 当前显示</span><b id="shown">--</b></div><div class="stat"><span>🤖 SR</span><b id="srCount">10,000</b></div><div class="stat"><span>👤 真人用户</span><b id="realCount">--</b></div><div class="stat"><span>💰 当前页资产</span><b id="asset">--</b></div>
</div></div>
<div class="card"><div class="tools"><input id="search" placeholder="搜索用户名 / SR ID / ZHI ID"><select id="type"><option value="">全部用户</option><option value="true">SR 用户</option><option value="false">真人用户</option></select><select id="pageSize"><option>50</option><option selected>100</option><option>250</option><option>500</option><option>1000</option></select><button class="btn primary" id="refresh">🔄 刷新</button></div><div id="msg" class="msg"></div></div>
<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>用户</th><th>ZHI ID</th><th>类型</th><th>SR ID</th><th>钱包</th><th>锁定</th><th>储蓄</th><th>贷款</th><th>净资产</th><th>行为</th><th>最后活动</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><button class="btn light" id="prev">‹ 上一页</button><span id="page">1 / ?</span><button class="btn light" id="next">下一页 ›</button></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script>
<script>
const sb=window.zhiSupabase,$=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString(),fmt=x=>x?new Date(x).toLocaleString('zh-CN',{timeZone:'Asia/Singapore',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}):'--';let offset=0,totalShown=0;
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function load(){const size=Number($('pageSize').value),q=$('search').value.trim()||null,sr=$('type').value===''?null:$('type').value==='true';$('msg').textContent='加载中…';$('rows').innerHTML='';const {data,error}=await sb.rpc('admin_get_users',{p_limit:size,p_offset:offset,p_search:q,p_sr_only:sr});if(error){$('msg').textContent='加载失败：'+error.message;$('msg').className='msg err';return}const rows=data||[];totalShown=rows.length;$('shown').textContent=rows.length.toLocaleString();$('realCount').textContent=rows.filter(x=>!x.is_sr).length.toLocaleString();$('asset').textContent=money(rows.reduce((a,x)=>a+Number(x.balance||0)+Number(x.locked_balance||0)+Number(x.savings_principal||0),0))+' ZHI';$('rows').innerHTML=rows.map(x=>'<tr><td><b>'+esc(x.username||'--')+'</b></td><td>ZHI-'+String(x.z_id??'').padStart(12,'0')+'</td><td class="'+(x.is_sr?'sr':'real')+'">'+(x.is_sr?'🤖 SR':'👤 真人')+'</td><td>'+esc(x.sr_id||'—')+'</td><td class="money">'+money(x.balance)+'</td><td class="money">'+money(x.locked_balance)+'</td><td class="money">'+money(x.savings_principal)+'</td><td class="money">'+money(x.loan_outstanding)+'</td><td class="money">'+money(x.open_bet_amount)+' ('+x.open_bet_count+')</td><td class="money">'+money(x.total_bet_amount)+' ('+x.total_bet_count+')</td><td>'+x.win_count+' / '+x.loss_count+'</td><td class="money">'+money(x.net_worth)+'</td><td>'+esc(x.behavior_profile||'--')+'</td><td>'+fmt(x.last_action_at||x.created_at)+'</td></tr>').join('')||'<tr><td colspan="11" class="empty">没有找到用户</td></tr>';$('page').textContent=(Math.floor(offset/size)+1)+' / '+(rows.length===size?'下一页可用':'最后一页');$('prev').disabled=offset===0;$('next').disabled=rows.length<size;$('msg').textContent='已从正式 ZHI 用户数据库读取。';}
$('refresh').onclick=()=>{offset=0;load()};$('prev').onclick=()=>{const s=Number($('pageSize').value);offset=Math.max(0,offset-s);load()};$('next').onclick=()=>{offset+=Number($('pageSize').value);load()};$('pageSize').onchange=()=>{offset=0;load()};$('type').onchange=()=>{offset=0;load()};let timer; $('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>{offset=0;load()},300)};load();
</script></body></html>
