name: Mia Publication Watchdog

# The watchdog uses Singapore local time and repairs missed/failed daily publications.
on:
  push:
    paths:
      - '.github/workflows/mia-publication-watchdog.yml'
  schedule:
    - cron: "*/15 8-16 * * *"
      timezone: "Asia/Singapore"
    - cron: "0 17-23 * * *"
      timezone: "Asia/Singapore"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: mia-publication-watchdog
  cancel-in-progress: false

jobs:
  verify-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current public outputs
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify today's Singapore-dated publications and recover missing tasks
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          today="$(TZ=Asia/Singapore date +%F)"
          now_hm="$(TZ=Asia/Singapore date +%H%M)"
          now_minutes=$((10#${now_hm:0:2} * 60 + 10#${now_hm:2:2}))
          cutoff="$(date -u -d '90 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"

          verify_output() {
            local file="$1"
            local kind="$2"
            node - "$file" "$kind" "$today" <<'NODE'
          const fs = require("fs");
          const [file, kind, today] = process.argv.slice(2);
          const x = JSON.parse(fs.readFileSync(file, "utf8"));
          const localDate = value => {
            if (!value) return "";
            const parts = new Intl.DateTimeFormat("en-CA", {
              timeZone: "Asia/Singapore",
              year: "numeric", month: "2-digit", day: "2-digit"
            }).formatToParts(new Date(value));
            const p = Object.fromEntries(parts.map(v => [v.type, v.value]));
            return `${p.year}-${p.month}-${p.day}`;
          };
          const dateField = kind === "sections" ? x.updated_at : x.date;
          const valid = x.status === "published"
            && x.safety_status === "passed"
            && dateField === today
            && localDate(x.generated_at) === today
            && (kind !== "sections" || (Array.isArray(x.sections) && x.sections.length === 4));
          process.exit(valid ? 0 : 1);
          NODE
          }

          recover_task() {
            local workflow="$1"
            local file="$2"
            local kind="$3"
            local due_after="$4"

            if (( now_minutes < due_after )); then
              echo "Not due yet: $workflow"
              return 0
            fi

            if verify_output "$file" "$kind"; then
              echo "Verified today's Singapore publication: $file"
              echo "- ✅ $file: today's publication is valid (SGT $today)." >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi

            echo "Publication missing, stale, or failed validation: $file"
            local runs
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&per_page=100")"

            local active
            active="$(jq --arg cutoff "$cutoff" '[.workflow_runs[] | select(.status != "completed") | select(.created_at >= $cutoff)] | length' <<< "$runs")"
            if (( active > 0 )); then
              echo "An active run exists for $workflow; waiting for it to finish."
              echo "- ⏳ $file: an active run exists; watchdog will recheck." >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi

            local dispatches
            dispatches="$(node - "$today" <<'NODE' <<< "$runs"
          const fs = require("fs");
          const today = process.argv[2];
          const data = JSON.parse(fs.readFileSync(0, "utf8"));
          const sgtDate = value => {
            const parts = new Intl.DateTimeFormat("en-CA", {
              timeZone: "Asia/Singapore",
              year: "numeric", month: "2-digit", day: "2-digit"
            }).formatToParts(new Date(value));
            const p = Object.fromEntries(parts.map(v => [v.type, v.value]));
            return `${p.year}-${p.month}-${p.day}`;
          };
          const count = (data.workflow_runs || []).filter(r =>
            r.event === "workflow_dispatch" && sgtDate(r.created_at) === today
          ).length;
          process.stdout.write(String(count));
          NODE
          )"

            if (( dispatches >= 8 )); then
              echo "Daily recovery limit reached for $workflow ($dispatches workflow_dispatch runs)."
              echo "- ⚠️ $file: recovery limit reached; manual investigation is required." >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi

            echo "Dispatching recovery run for $workflow (attempt $((dispatches + 1))/8)."
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" \
              -f ref=main
            echo "- 🔁 $file: dispatched recovery run (attempt $((dispatches + 1))/8)." >> "$GITHUB_STEP_SUMMARY"
          }

          echo "## Mia daily publication watchdog" >> "$GITHUB_STEP_SUMMARY"
          echo "Singapore date: $today; local time: $(TZ=Asia/Singapore date +%H:%M)." >> "$GITHUB_STEP_SUMMARY"

          recover_task "mia-daily.yml" "mia/daily.json" "daily" "$((8 * 60 + 20))"
          recover_task "mia-todays-philosophy.yml" "mia/todays-philosophy.json" "philosophy" "$((8 * 60 + 50))"
          recover_task "mia-sections.yml" "mia/sections.json" "sections" "$((9 * 60 + 10))"
