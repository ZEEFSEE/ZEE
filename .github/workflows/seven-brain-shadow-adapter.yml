name: Verify ZHI seven-brain shadow adapter

on:
  pull_request:
    paths:
      - "mia-digital-family/runtime/seven-brain-shadow-adapter.mjs"
      - "mia-digital-family/tests/seven-brain-shadow-adapter.test.mjs"
      - ".github/workflows/seven-brain-shadow-adapter.yml"
      - "mia-digital-family/runtime/seven-brain-coordination-bus.mjs"
      - "mia-digital-family/tests/seven-brain-coordination-bus.test.mjs"
      - ".github/workflows/seven-brain-coordination-bus.yml"
      - "mia-digital-family/runtime/seven-brain-deliberation-simulator.mjs"
      - "mia-digital-family/tests/seven-brain-deliberation-simulator.test.mjs"
      - ".github/workflows/seven-brain-deliberation-simulator.yml"
      - "mia-digital-family/runtime/capability-validation-state-machine.mjs"
      - "mia-digital-family/tests/capability-validation-state-machine.test.mjs"
      - ".github/workflows/capability-validation-state-machine.yml"
      - "mia-digital-family/runtime/identity-evolution-shadow.mjs"
      - "mia-digital-family/tests/identity-evolution-shadow.test.mjs"
      - ".github/workflows/identity-evolution-shadow.yml"
  push:
    branches: ["main"]
    paths:
      - "mia-digital-family/runtime/seven-brain-shadow-adapter.mjs"
      - "mia-digital-family/tests/seven-brain-shadow-adapter.test.mjs"
      - ".github/workflows/seven-brain-shadow-adapter.yml"
      - "mia-digital-family/runtime/capability-validation-state-machine.mjs"
      - "mia-digital-family/tests/capability-validation-state-machine.test.mjs"
      - "mia-digital-family/runtime/identity-evolution-shadow.mjs"
      - "mia-digital-family/tests/identity-evolution-shadow.test.mjs"

permissions:
  contents: read

jobs:
  shadow-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify metadata-only mapping and isolation invariants
        run: node --test mia-digital-family/tests/seven-brain-shadow-adapter.test.mjs
      - name: Verify privacy-first coordination bus contract
        run: node --test mia-digital-family/tests/seven-brain-coordination-bus.test.mjs
      - name: Verify seven-brain deliberation simulator
        run: node --test mia-digital-family/tests/seven-brain-deliberation-simulator.test.mjs
      - name: Verify isolated capability validation state machine
        run: node --test mia-digital-family/tests/capability-validation-state-machine.test.mjs
      - name: Verify six-subject identity continuity and cross-time replay
        run: node --test mia-digital-family/tests/identity-evolution-shadow.test.mjs
