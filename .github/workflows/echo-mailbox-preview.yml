name: Echo Mailbox Preview Safety

on:
  pull_request:
    paths:
      - "echo-mailbox/**"
      - "supabase/functions/echo-submit/**"
      - "supabase/functions/_shared/**"
      - "supabase/design/**"
      - "supabase/echo-mailbox/**"
      - ".github/workflows/echo-mailbox-preview.yml"
      - ".github/workflows/pages.yml"
  push:
    branches: ["main", "feature/echo-mailbox-bilingual-mvp", "feature/echo-mailbox-backend-hardening"]
    paths:
      - "echo-mailbox/**"
      - "supabase/functions/echo-submit/**"
      - "supabase/functions/_shared/**"
      - "supabase/design/**"
      - "supabase/echo-mailbox/**"
      - ".github/workflows/echo-mailbox-preview.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

jobs:
  preview-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate bilingual preview and fail-closed backend
        run: node echo-mailbox/tests/validate-preview.mjs
      - name: Run publication gate adversarial tests
        run: node --test echo-mailbox/tests/echo-gate.test.mjs echo-mailbox/tests/echo-schema.test.mjs echo-mailbox/tests/agnes-adapter.test.mjs echo-mailbox/tests/echo-pipeline.test.mjs echo-mailbox/tests/echo-persistence.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check gated Edge Function
        run: deno check supabase/functions/echo-submit/index.ts
