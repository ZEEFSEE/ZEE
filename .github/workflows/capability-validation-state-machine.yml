name: Verify ZHI capability validation state machine

on:
  pull_request:
    paths:
      - "mia-digital-family/runtime/capability-validation-state-machine.mjs"
      - "mia-digital-family/tests/capability-validation-state-machine.test.mjs"
      - ".github/workflows/capability-validation-state-machine.yml"
  push:
    branches: ["main"]
    paths:
      - "mia-digital-family/runtime/capability-validation-state-machine.mjs"
      - "mia-digital-family/tests/capability-validation-state-machine.test.mjs"
      - ".github/workflows/capability-validation-state-machine.yml"

permissions:
  contents: read

jobs:
  capability-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run isolated capability validation tests
        run: node --test mia-digital-family/tests/capability-validation-state-machine.test.mjs
