<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script>const sb=window.zhiSupabase;let user=null,wallet=null;
const money=n=>Number(n||0).toLocaleString(),$=id=>document.getElementById(id);
function showErr(s){const e=$('authError');if(e)e.textContent=s||''}
function showSavingsMsg(text,type='success'){const e=$('savingsMsg');if(!e)return;e.textContent=text;e.className='savings-msg show '+type;clearTimeout(window.__savingsMsgTimer);window.__savingsMsgTimer=setTimeout(()=>e.classList.remove('show'),5000)}
async function loadLoanLimit(){const r=await sb.rpc('get_loan_limit');if(!r.error&&$('loanLimit'))$('loanLimit').textContent='最高可贷 '+money(r.data?.max_loan||0)+' ZHI'}
async function loadFinancePanel(){
 const w=await sb.from('wallets').select('balance').eq('user_id',user.id).maybeSingle();
 const s=await sb.from('zhi_savings').select('principal').eq('user_id',user.id).maybeSingle();
 const l=await sb.from('zhi_loans').select('outstanding,accrued_interest,annual_rate').eq('user_id',user.id).gt('outstanding',0);
 const lim=await sb.rpc('get_loan_limit');const rows=l.data||[];
 if($('financeWallet'))$('financeWallet').textContent=money(w.data?.balance||0)+' ZHI';
 if($('financeSavings'))$('financeSavings').textContent=money(s.data?.principal||0)+' ZHI';
 if($('financeLoan'))$('financeLoan').textContent=money(rows.reduce((a,x)=>a+Number(x.outstanding||0),0))+' ZHI';
 if($('financeInterest'))$('financeInterest').textContent=money(rows.reduce((a,x)=>a+Number(x.accrued_interest||0),0))+' ZHI';
 if($('financeRate'))$('financeRate').textContent=(rows[0]?.annual_rate||8)+'%';
 if($('financeLimit'))$('financeLimit').textContent=money(lim.data?.max_loan||0)+' ZHI';
}
async function takeLoan(){const a=Math.floor(Number($('loanAmount')?.value));if(!Number.isFinite(a)||a<1)return alert('请输入至少 1 ZHI');const r=await sb.rpc('take_zhi_loan',{p_amount:a});if(r.error)return alert(r.error.message);$('loanAmount').value='';if($('loanMsg'))$('loanMsg').textContent='贷款 '+money(a)+' ZHI 已到账';await loadFinancePanel();await load()}
async function repayLoan(){const a=Math.floor(Number($('loanAmount')?.value));if(!Number.isFinite(a)||a<1)return alert('请输入还款金额');const r=await sb.rpc('repay_zhi_loan',{p_amount:a});if(r.error)return alert(r.error.message);$('loanAmount').value='';if($('loanMsg'))$('loanMsg').textContent='已还款 '+money(r.data?.repaid||a)+' ZHI';await loadFinancePanel();await load()}
async function saveZhi(){const a=Math.floor(Number($('saveAmount')?.value));if(!Number.isFinite(a)||a<1)return showSavingsMsg('请输入至少 1 ZHI','error');const r=await sb.rpc('save_zhi',{p_amount:a});if(r.error)return showSavingsMsg('存入失败：'+r.error.message,'error');$('saveAmount').value='';showSavingsMsg('✅ 已成功存入 '+money(a)+' ZHI 到财神爷','success');await load()}
async function withdrawZhi(){const a=Math.floor(Number($('withdrawAmount')?.value));if(!Number.isFinite(a)||a<1)return showSavingsMsg('请输入取款金额','error');const r=await sb.rpc('withdraw_zhi',{p_amount:a});if(r.error)return showSavingsMsg('取款失败：'+r.error.message,'error');$('withdrawAmount').value='';showSavingsMsg('✅ 已成功取出 '+money(a)+' ZHI，已回到钱包','success');await load()}
async function claimSavings(){const r=await sb.rpc('claim_zhi_savings');if(r.error)return showSavingsMsg('领取利息失败：'+r.error.message,'error');const n=Number(r.data?.interest||0);showSavingsMsg(n>0?'💰 已成功领取 '+money(n)+' ZHI 利息':'目前还没有可领取的整数利息',n>0?'success':'error');await load()}
async function loadGiftNotice(){
 const r=await sb.from('transactions').select('id,amount,description,metadata,created_at,read_at').eq('user_id',user.id).eq('type','transfer_in').order('created_at',{ascending:false}).limit(20);const box=$('giftNotice'),btn=$('giftNoticeBtn'),count=$('giftNoticeCount');if(!box||!btn||!count)return;
 if(r.error||!r.data?.length){btn.style.display='none';box.classList.add('hidden');return}const data=r.data,unread=data.filter(x=>!x.read_at),visible=(unread.length?unread:data).slice(0,5);count.textContent=unread.length;btn.style.display='block';box.classList.remove('hidden');
 box.innerHTML='<div class="gift-toggle" id="giftToggle"><span>🎁 <b>'+(unread.length?'未读转赠 / Unread gifts':'转赠记录 / Gift history')+'</b></span><span class="gift-arrow" id="giftArrow">▼</span></div><div class="gift-details" id="giftDetails">'+visible.map(x=>'<div class="gift-row"><b>'+String(x.metadata?.from_username||'用户 / User')+'</b> 赠送了 <b>'+money(x.amount)+' ZHI</b><br><span style="color:#999">'+new Date(x.created_at).toLocaleString()+'</span></div>').join('')+'</div>';
 const t=$('giftToggle'),d=$('giftDetails'),a=$('giftArrow');t.onclick=()=>{d.classList.toggle('open');a.classList.toggle('open')}
}
async function markGiftNotificationsRead(){const r=await sb.rpc('mark_transfer_notifications_read');if(r.error)return alert(r.error.message);await loadGiftNotice()}
async function transferZHI(){const u=$('transferUsername')?.value.trim(),a=Math.floor(Number($('transferAmount')?.value));if(!u)return $('transferError').textContent='请输入收赠用户名';if(!Number.isFinite(a)||a<1)return $('transferError').textContent='请输入有效数量';if(a>Number(wallet?.balance||0))return $('transferError').textContent='余额不足';if(!confirm('确定转赠 '+money(a)+' ZHI 给 '+u+'？'))return;$('transferBtn').disabled=true;try{const r=await sb.rpc('transfer_zhi',{p_to_username:u,p_amount:a});if(r.error)throw r.error;$('transferUsername').value='';$('transferAmount').value='';alert('转赠成功 / Transfer sent');await load()}catch(e){$('transferError').textContent=e.message||'转赠失败'}finally{$('transferBtn').disabled=false}}
async function loadAdminUsers(){
 const box=$('adminUsers');if(!box)return;box.innerHTML='<div class="notice">加载中 / Loading...</div>';const r=await sb.rpc('admin_get_user_overview');if(r.error){box.innerHTML='<div class="notice">加载失败 / Failed: '+r.error.message+'</div>';return}
 box.innerHTML=(r.data||[]).map(x=>'<div style="padding:12px 0;border-bottom:1px solid #eee"><div style="display:flex;justify-content:space-between"><b>'+x.username+'</b><b>'+money(x.balance)+' ZHI</b></div><div class="meta">钱包 / Wallet: '+money(x.balance)+' ZHI · 锁定 / Locked: '+money(x.locked_balance||0)+' ZHI</div></div>').join('')||'<div class="notice">暂无用户 / No users yet</div>';
}
async function loadAdminFundFlows(){
 const box=$('afList');if(!box)return;box.innerHTML='<div class="notice">加载中 / Loading...</div>';const r=await sb.rpc('admin_get_fund_flows',{p_limit:500});if(r.error){box.innerHTML='<div class="notice">加载失败 / Failed: '+r.error.message+'</div>';return}
 const d=r.data||{},filter=$('afFilter')?.value||'all',uf=($('afUser')?.value||'').trim().toLowerCase(),rows=(d.rows||[]).filter(x=>(filter==='all'||x.flow_type===filter)&&(!uf||String(x.username||'').toLowerCase().includes(uf)));
 if($('afIn'))$('afIn').textContent=money(d.total_inflow||0)+' ZHI';if($('afOut'))$('afOut').textContent=money(d.total_outflow||0)+' ZHI';if($('afNet'))$('afNet').textContent=(Number(d.net||0)>=0?'+':'')+money(d.net||0)+' ZHI';if($('afCount'))$('afCount').textContent=rows.length;
 const labels={savings_deposit:'🏦 存入',savings_withdrawal:'↩️ 取出',loan_disbursement:'💳 贷款发放',savings_interest:'📈 存款利息',loan_interest_accrual:'📊 贷款计息',loan_repayment:'↩️ 还款',transfer_out:'🎁 转赠',transfer_in:'🎁 收到转赠',signup_bonus:'🎁 注册奖励'};
 box.innerHTML=rows.slice(0,200).map(x=>'<div style="padding:10px 0;border-bottom:1px solid #eee"><div style="display:flex;justify-content:space-between"><b>'+String(x.username||'系统')+'</b><b>'+(Number(x.amount)>=0?'+':'')+money(x.amount)+' ZHI</b></div><div class="meta">'+(labels[x.flow_type]||labels[x.type]||x.type||'流水')+' · '+new Date(x.created_at).toLocaleString()+'</div><div style="font-size:12px">'+String(x.description||'')+'</div></div>').join('')||'<div class="notice">暂无匹配流水 / No matching flows</div>';
}
function renderHistory(list){const e=$('history');if(!e)return;e.innerHTML=(list||[]).map(x=>'<div class="row"><span>'+String(x.description||x.type||'流水')+'</span><b>'+(Number(x.amount)>=0?'+':'')+money(x.amount)+' ZHI</b></div>').join('')||'暂无记录'}
async function load(passedUser=null){
 try{if(passedUser)user=passedUser;else{const r=await sb.auth.getSession();if(r.error)throw r.error;user=r.data.session?.user||null}}catch(e){user=null}
 if(!user){$('authScreen').classList.remove('hidden');$('app').classList.add('hidden');return}
 $('authScreen').classList.add('hidden');$('app').classList.remove('hidden');
 const [w,t,profile]=await Promise.all([sb.from('wallets').select('*').eq('user_id',user.id).single(),sb.from('transactions').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(30),sb.from('profiles').select('username,z_id').eq('id',user.id).maybeSingle()]);
 wallet=w.data;if($('balance'))$('balance').textContent=money(wallet?.balance||0);if($('topUsername'))$('topUsername').textContent=profile.data?.username||user.user_metadata?.username||user.email?.split('@')[0]||'--';if($('topZId'))$('topZId').textContent=profile.data?.z_id?'ID: ZHI-'+String(profile.data.z_id).padStart(12,'0'):'ID: ZHI-000000000000';renderHistory(t.data||[]);
 await loadGiftNotice();await loadFinancePanel();await loadLoanLimit();
 const admin=user.app_metadata?.role==='admin';if($('adminPanel'))$('adminPanel').classList.toggle('hidden',!admin);if(admin){await loadAdminUsers();await loadAdminFundFlows();await loadTreasuryFinance()}
}
async function loadTreasuryFinance(){const r=await sb.rpc('get_treasury_finance');if(r.error)return;const d=r.data||{};[['tfTotal',d.total_treasury],['tfAvailable',d.available_balance],['tfSavings',d.user_savings],['tfLoans',d.user_loans],['tfLoanInterest',d.loan_interest_due],['tfSavingsInterest',d.savings_interest_paid]].forEach(([id,v])=>{if($(id))$(id).textContent=money(v||0)+' ZHI'});if($('tfSupply'))$('tfSupply').textContent='弹性发行'}
$('transferBtn').onclick=transferZHI;
$('authSubmit').onclick=async()=>{const u=$('authUsername').value.trim(),p=$('authPassword').value;if(!/^[a-zA-Z0-9_]{2,24}$/.test(u))return showErr('用户名只能用 2-24 位英文字母、数字或下划线');if(p.length<6)return showErr('密码至少6位');showErr('');$('authSubmit').disabled=true;try{const {data,error}=await sb.auth.signInWithPassword({email:u.toLowerCase()+'@zhi-demo.com',password:p});if(error)throw error;if(!data?.user)throw new Error('登录成功但没有取得用户会话');$('authScreen').classList.add('hidden');$('app').classList.remove('hidden');await load(data.user)}catch(e){showErr(e.message||'登录失败')}finally{$('authSubmit').disabled=false}};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
if($('saveBtn'))$('saveBtn').onclick=saveZhi;if($('claimBtn'))$('claimBtn').onclick=claimSavings;if($('withdrawBtn'))$('withdrawBtn').onclick=withdrawZhi;if($('loanBtn'))$('loanBtn').onclick=takeLoan;if($('repayBtn'))$('repayBtn').onclick=repayLoan;if($('giftNoticeBtn'))$('giftNoticeBtn').onclick=markGiftNotificationsRead;if($('adminFundFlowsToggle'))$('adminFundFlowsToggle').onclick=()=>{$('adminFundFlowsDetails')?.classList.toggle('open');$('adminFundFlowsArrow')?.classList.toggle('open')};if($('adminUserFundsToggle'))$('adminUserFundsToggle').onclick=()=>{$('adminUserFundsDetails')?.classList.toggle('open');$('adminUserFundsArrow')?.classList.toggle('open')};if($('afRefresh'))$('afRefresh').onclick=loadAdminFundFlows;if($('afFilter'))$('afFilter').onchange=loadAdminFundFlows;
load();</script><script>
(function(){
  function init(){
    if(document.getElementById('zhiLangSwitch'))return;
    const b=document.createElement('div');b.id='zhiLangSwitch';
    b.style.cssText='position:fixed;top:10px;right:10px;z-index:9999;display:flex;gap:5px;background:rgba(255,255,255,.96);border:1px solid #ead28a;border-radius:999px;padding:4px;box-shadow:0 5px 18px rgba(0,0,0,.12)';
    b.innerHTML='<a href="index.html" style="padding:5px 9px;border-radius:999px;text-decoration:none;font-size:11px;font-weight:900;color:#fff;background:#8a5a00">中文</a><a href="en.html" style="padding:5px 9px;border-radius:999px;text-decoration:none;font-size:11px;font-weight:900;color:#3157b7">English</a>';
    document.body.appendChild(b);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script><script data-zhi-24h="1">
(function(){
  const nativeToLocaleString=Date.prototype.toLocaleString;
  const nativeToLocaleTimeString=Date.prototype.toLocaleTimeString;
  Date.prototype.toLocaleString=function(locales,options){const o=Object.assign({},options||{});if(o.hour12===undefined)o.hour12=false;return nativeToLocaleString.call(this,locales,o)};
  Date.prototype.toLocaleTimeString=function(locales,options){const o=Object.assign({},options||{});if(o.hour12===undefined)o.hour12=false;return nativeToLocaleTimeString.call(this,locales,o)};
})();
</script>
