<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIA Local Camera Gateway</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Segoe UI,sans-serif;background:#101820;color:#edf3f6}
body{max-width:760px;margin:32px auto;padding:0 18px}
main{background:#192630;border:1px solid #314653;border-radius:16px;padding:22px}
h1{margin-top:0}p{color:#b7c7d0;line-height:1.5}
video{display:block;width:100%;max-height:420px;background:#05090c;border-radius:12px;object-fit:contain}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
button{border:0;border-radius:9px;padding:11px 16px;font-weight:650;cursor:pointer;background:#8ad8bc;color:#10221c}
button.secondary{background:#314653;color:#edf3f6}
button:disabled{opacity:.45;cursor:not-allowed}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d151b;padding:12px;border-radius:9px;color:#c8e7dc}
#status{min-height:2em;color:#b8e9d5}
.small{font-size:.88rem}
</style>
</head>
<body>
<main>
<h1>MIA · 本地摄像头单帧测试</h1>
<p>摄像头仅在你点击“开启摄像头”后启动。预览不会上传。只有点击“采集并发送一帧”时，当前单帧才会发送到隔离测试入口。</p>
<video id="video" autoplay muted playsinline></video>
<div class="controls">
<button id="start">开启摄像头</button>
<button id="capture" disabled>采集并发送一帧</button>
<button id="stop" class="secondary" disabled>关闭摄像头</button>
</div>
<p id="status" role="status">正在检查本地网关……</p>
<p class="small">设备来源登记信息（仅公钥，可用于在测试数据库注册设备）：</p>
<pre id="device">读取中……</pre>
<p class="small">隐私边界：不录音、不连续录像、不自动上传、不进行人脸身份识别。采集帧会写入 zee-prediction 的 mia_test 测试审计数据。</p>
</main>
<script>
const video=document.querySelector("#video");
const start=document.querySelector("#start");
const capture=document.querySelector("#capture");
const stop=document.querySelector("#stop");
const status=document.querySelector("#status");
const deviceBox=document.querySelector("#device");
let stream=null;
let enrolled=false;
async function init(){
  const r=await fetch("/api/status",{cache:"no-store"});
  const s=await r.json();
  enrolled=s.enrolled;
  deviceBox.textContent=JSON.stringify({
    source_id:s.source_id,key_id:s.key_id,public_key_b64url:s.public_key_b64url,
    enrolled:s.enrolled,ingress_configured:s.ingress_configured
  },null,2);
  status.textContent=s.ingress_configured
    ? (s.enrolled?"网关就绪。请手动开启摄像头。":"等待测试数据库登记此设备公钥。")
    : "本地网关尚未配置测试项目 API Secret。";
}
start.addEventListener("click",async()=>{
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},facingMode:"user"},audio:false});
    video.srcObject=stream;
    capture.disabled=!enrolled;
    stop.disabled=false;
    status.textContent=enrolled?"摄像头已开启。预览不会上传；点击按钮才会发送单帧。":"摄像头已开启，但设备尚未登记，暂不能上传。";
  }catch(e){status.textContent="无法开启摄像头："+(e?.message||String(e));}
});
stop.addEventListener("click",()=>{
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;video.srcObject=null;capture.disabled=true;stop.disabled=true;
  status.textContent="摄像头已关闭。";
});
async function makeJpeg(){
  const canvas=document.createElement("canvas");
  canvas.width=320;canvas.height=240;
  const ctx=canvas.getContext("2d",{alpha:false});
  const sw=video.videoWidth,sh=video.videoHeight;
  if(!sw||!sh)throw new Error("camera_frame_not_ready");
  const scale=Math.max(320/sw,240/sh);
  const dw=sw*scale,dh=sh*scale;
  ctx.drawImage(video,(320-dw)/2,(240-dh)/2,dw,dh);
  for(const quality of [.58,.5,.42,.34,.28]){
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",quality));
    if(blob&&blob.size<=40*1024)return blob;
  }
  throw new Error("jpeg_exceeds_40kb_try_better_lighting");
}
capture.addEventListener("click",async()=>{
  capture.disabled=true;status.textContent="正在压缩单帧并发送到 MIA 测试入口……";
  try{
    const blob=await makeJpeg();
    const r=await fetch("/api/capture",{method:"POST",headers:{"Content-Type":"image/jpeg"},body:blob});
    const result=await r.json();
    status.textContent=r.ok
      ? "单帧已进入测试感知入口。请查看回执。"
      : "测试入口未接受本帧："+(result.error||result.decision_reason||r.status);
    deviceBox.textContent=JSON.stringify(result,null,2);
  }catch(e){status.textContent="采集失败："+(e?.message||String(e));}
  finally{capture.disabled=!stream||!enrolled;}
});
window.addEventListener("beforeunload",()=>{if(stream)stream.getTracks().forEach(t=>t.stop());});
init().catch(e=>status.textContent="本地网关状态读取失败："+e.message);
</script>
</body>
</html>
