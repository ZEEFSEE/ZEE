<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZHI知币 Prediction</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#171a21;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:720px;margin:auto;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-size:22px;font-weight:800}.balance{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:8px 12px;font-weight:700}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin-bottom:12px}
.total{font-size:13px;color:#777}.big{font-size:28px;font-weight:800;margin-top:4px}
h2{font-size:16px;margin:22px 2px 10px}.q{font-weight:700;line-height:1.45}.meta{font-size:12px;color:#888;margin:7px 0 13px}
.pool{font-size:12px;color:#666;margin-bottom:12px}.buttons{display:flex;gap:8px}.btn{flex:1;border:0;border-radius:10px;padding:11px;font-weight:800;cursor:pointer}.yes{background:#dff8ea;color:#087443}.no{background:#ffe2e5;color:#b42332}.confirm{background:#20242c;color:#fff}
.stake{display:none;gap:8px;margin-top:8px}.stake.show{display:flex}.stake input{flex:1;border:1px solid #ddd;border-radius:9px;padding:10px}
.status{font-size:12px;font-weight:700}.open{color:#087443}.expired{color:#b26a00}.resolved{color:#3157b7}
.notice{font-size:12px;color:#777;background:#f0f2f6;border-radius:10px;padding:10px;margin-top:10px}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.authbox{width:100%;max-width:380px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:#777;margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px}.link{border:0;background:none;color:#3157b7;cursor:pointer}.err{height:18px;color:#c62828;font-size:12px}
.hidden{display:none!important}.history{font-size:13px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.row:last-child{border:0}
footer{text-align:center;color:#aaa;font-size:11px;margin-top:24px}
</style>
</head>
<body>
<section id="authScreen" class="auth"><div class="authbox">
<h1>💰 ZHI知币</h1><p id="authSub">登录账户，开始预测</p>
<div class="field"><label>用户名</label><input id="authUsername" placeholder="zhi_player"></div>
<div class="field"><label>密码</label><input id="authPassword" type="password" placeholder="至少 6 位"></div>
<div id="authError" class="err"></div>
<button id="authSubmit" class="btn confirm" style="width:100%">登录</button>
<p style="text-align:center;color:#777;font-size:13px"><span id="switchText">还没有账户？</span> <button id="authSwitchBtn" class="link">立即注册</button></p>
<div class="notice">ZHI 为本网站预测演示积分。</div>
</div></section>

<main id="app" class="wrap hidden">
<div class="top"><div class="brand">💰 ZHI知币</div><div class="balance">余额 <span id="balance">--</span> ZHI</div></div>
<div class="card"><div class="total">财神爷 · ZHI 总额</div><div class="big">3,000,000,000,000 ZHI</div></div>

<h2>🎯 预测市场</h2><div id="markets"></div>
<div id="expiredPanel" class="hidden"><h2>⏰ 已到期</h2><div id="expiredMarkets"></div></div>

<h2>🧾 我的记录</h2><div id="history" class="card history"></div>
<button id="logout" class="link" style="display:block;margin:18px auto">退出登录</button>
<footer>ZHI知币 · Prediction Demo</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="settlement.js"></script>
<script>
const sb=window.zhiSupabase;let user=null,wallet=null,marketsData=[],positions=[];
const money=n=>Number(n||0).toLocaleString(),$=id=>document.getElementById(id);
function showErr(s){$('authError').textContent=s}
async function load(){
 const r=await sb.auth.getUser();user=r.data.user;
 if(!user){$('authScreen').classList.remove('hidden');$('app').classList.add('hidden');return}
 await sb.rpc('close_expired_markets');
 const [w,m,p,h]=await Promise.all([
  sb.from('wallets').select('*').eq('user_id',user.id).single(),
  sb.from('markets').select('*').order('created_at',{ascending:true}),
  sb.from('positions').select('*').eq('user_id',user.id).eq('status','open'),
  sb.from('transactions').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(10)
 ]);
 wallet=w.data;marketsData=m.data||[];positions=p.data||[];
 $('balance').textContent=money(wallet?.balance);
 $('authScreen').classList.add('hidden');$('app').classList.remove('hidden');
 renderMarkets();renderHistory(h.data||[]);
}
function renderMarkets(){
 const open=marketsData.filter(m=>m.status==='open'&&new Date(m.close_at)>new Date());
 $('markets').innerHTML=open.map(m=>{
  const mine=positions.find(p=>p.market_id===m.id);
  return '<div class="card"><div class="q">'+m.question+'</div><div class="meta">截止：'+new Date(m.close_at).toLocaleString('zh-CN')+'</div>'+
  '<div class="pool">YES '+money(m.yes_pool)+' ZHI　 NO '+money(m.no_pool)+' ZHI</div>'+
  '<div class="buttons"><button class="btn yes" data-id="'+m.id+'" data-side="yes" '+(mine?'disabled':'')+'>YES</button><button class="btn no" data-id="'+m.id+'" data-side="no" '+(mine?'disabled':'')+'>NO</button></div>'+
  '<div class="stake" id="s-'+m.id+'"><input id="a-'+m.id+'" type="number" min="1" placeholder="ZHI 数量"><button class="btn confirm" data-confirm="'+m.id+'">确认</button></div>'+
  (mine?'<div class="notice">你已预测 '+money(mine.stake)+' ZHI</div>':'')+'</div>';
 }).join('')||'<div class="card">目前没有进行中的市场。</div>';
 $('markets').querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{
   const s=$('s-'+b.dataset.id);s.dataset.side=b.dataset.side;s.classList.add('show');
 });
 $('markets').querySelectorAll('[data-confirm]').forEach(b=>b.onclick=()=>stake(b.dataset.confirm));
 const expired=marketsData.filter(m=>m.status==='closed');
 $('expiredPanel').classList.toggle('hidden',!expired.length);
 $('expiredMarkets').innerHTML=expired.map(m=>'<div class="card"><div class="q">'+m.question+'</div><div class="status expired">⏰ 已到期 · 等待结果</div></div>').join('');
}
async function stake(id){
 const s=$('s-'+id),amount=Math.floor(Number($('a-'+id).value));
 if(!amount||amount<1)return alert('请输入 ZHI 数量');
 if(amount>Number(wallet.balance))return alert('ZHI 余额不足');
 const {error}=await sb.rpc('place_stake',{p_market_id:id,p_side:s.dataset.side,p_amount:amount});
 if(error)return alert(error.message);
 await load();
}
function renderHistory(list){
 $('history').innerHTML=list.length?list.map(x=>'<div class="row"><span>'+ (x.description||x.type)+'</span><b>'+(Number(x.amount)>=0?'+':'')+money(x.amount)+' ZHI</b></div>').join(''):'暂无记录';
}
let mode='login';
$('authSubmit').onclick=async()=>{
 const u=$('authUsername').value.trim(),p=$('authPassword').value;
 if(u.length<2||p.length<6)return showErr('用户名至少2位，密码至少6位');
 showErr('');$('authSubmit').disabled=true;
 try{
  const email=u.toLowerCase()+'@zhi.local';
  if(mode==='signup'){
   const {data,error}=await sb.auth.signUp({email,password:p,options:{data:{username:u}}});
   if(error)throw error;if(data.session)await load();else showErr('注册成功，请完成验证后登录');
  }else{
   const {error}=await sb.auth.signInWithPassword({email,password:p});if(error)throw error;await load();
  }
 }catch(e){showErr(e.message||'操作失败')}finally{$('authSubmit').disabled=false}
};
$('authSwitchBtn').onclick=()=>{
 mode=mode==='login'?'signup':'login';
 $('authSub').textContent=mode==='login'?'登录账户，开始预测':'创建你的 ZHI 账户';
 $('authSubmit').textContent=mode==='login'?'登录':'注册';
 $('switchText').textContent=mode==='login'?'还没有账户？':'已有账户？';
 $('authSwitchBtn').textContent=mode==='login'?'立即注册':'直接登录';
 showErr('');
};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
load();
</script>
</body></html>
