name: Verify ZHI production and identity evidence gates

on:
  pull_request:
    paths:
      - "mia-digital-family/runtime/production-evidence-gate.mjs"
      - "mia-digital-family/tests/production-evidence-gate.test.mjs"
      - "mia-digital-family/PRODUCTION-EVIDENCE-GATE-V1.md"
      - "mia-digital-family/runtime/identity-capability-evidence.mjs"
      - "mia-digital-family/tests/identity-capability-evidence.test.mjs"
      - "mia-digital-family/IDENTITY-CAPABILITY-EVIDENCE-V1.md"
      - ".github/workflows/production-evidence-gate.yml"
      - ".github/workflows/identity-capability-evidence.yml"
  push:
    branches: ["main"]
    paths:
      - "mia-digital-family/runtime/production-evidence-gate.mjs"
      - "mia-digital-family/tests/production-evidence-gate.test.mjs"
      - "mia-digital-family/PRODUCTION-EVIDENCE-GATE-V1.md"
      - "mia-digital-family/runtime/identity-capability-evidence.mjs"
      - "mia-digital-family/tests/identity-capability-evidence.test.mjs"
      - "mia-digital-family/IDENTITY-CAPABILITY-EVIDENCE-V1.md"
      - ".github/workflows/production-evidence-gate.yml"
      - ".github/workflows/identity-capability-evidence.yml"

permissions:
  contents: read

jobs:
  production-evidence-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate redacted production evidence
        run: node --test mia-digital-family/tests/production-evidence-gate.test.mjs
      - name: Verify identity continuity and capability evidence
        run: node --test mia-digital-family/tests/identity-capability-evidence.test.mjs
