name: Mia Four-Dimension Sections

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/mia-sections.yml"

permissions: {}

concurrency:
  group: mia-sections-publication
  cancel-in-progress: false

jobs:
  generate-and-stage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Obtain short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mia-sections")"
          token="$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.value)process.exit(1);process.stdout.write(j.value)})' <<< "$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Generate four sections from Mia's private context (server-side)
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          PUBLISH_FUNCTION_URL: https://dbooikzqprnqbgpfwsze.supabase.co/functions/v1/mia-sections-publish
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST "$PUBLISH_FUNCTION_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -o mia/sections.json
          node -e 'const fs=require("fs");const p="mia/sections.json";const x=JSON.parse(fs.readFileSync(p,"utf8"));if(x.status!=="published"||x.safety_status!=="passed"||!Array.isArray(x.sections)||x.sections.length!==4||!x.updated_at||!x.generated_at)process.exit(1);for(const s of x.sections){if(typeof s.content!=="string"||s.content.trim().length<100||!Array.isArray(s.mood)||s.mood.length<1)process.exit(1)}fs.writeFileSync(p,JSON.stringify(x,null,2)+"\n");'

      - name: Run local public-content safety gate
        run: node mia/sections-safety-check.mjs

      - name: Upload reviewed sections JSON
        uses: actions/upload-artifact@v4
        with:
          name: mia-sections-json
          path: mia/sections.json
          if-no-files-found: error
          retention-days: 2

  commit-reviewed-json:
    needs: generate-and-stage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download reviewed JSON
        uses: actions/download-artifact@v4
        with:
          name: mia-sections-json
          path: reviewed

      - name: Commit only the reviewed public JSON
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preserve the validated artifact outside the checkout while refreshing main.
          install -m 0644 reviewed/sections.json /tmp/mia-sections-reviewed.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            install -m 0644 /tmp/mia-sections-reviewed.json mia/sections.json
            node -e 'const fs=require("fs");const p="mia/sections.json";const x=JSON.parse(fs.readFileSync(p,"utf8"));fs.writeFileSync(p,JSON.stringify(x,null,2)+"\n");'
            node mia/sections-safety-check.mjs
            if git diff --quiet -- mia/sections.json; then
              echo "No public JSON change to commit."
              exit 0
            fi
            git add -- mia/sections.json
            git commit -m "Publish Mia four-dimension sections"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race detected on attempt $attempt; refreshing main and retrying."
            sleep "$attempt"
          done
          echo "Could not publish after three attempts; previous remote file remains intact."
          exit 1
  deploy-pages:
    needs: [generate-and-stage, commit-reviewed-json]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest committed main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload latest committed site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy latest committed site
        id: deployment
        uses: actions/deploy-pages@v4

