name: MIA perception ingress HTTP test

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/mia-perception-ingress-test/**"
      - ".github/workflows/mia-perception-ingress-http.yml"
  push:
    branches: [mia/spatial-permission-http-test-v1]
    paths:
      - "supabase/functions/mia-perception-ingress-test/**"
      - ".github/workflows/mia-perception-ingress-http.yml"
      - "supabase/migrations/**"

permissions:
  contents: read

concurrency:
  group: mia-perception-ingress-http
  cancel-in-progress: false

jobs:
  ingress-http:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: https://boaiqnkhrytxwdpgkxti.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.ZEE_PREDICTION_SECRET_KEY }}
    steps:
      - name: Run isolated signed-ingress tests
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { generateKeyPairSync, createHash, randomBytes, randomUUID, sign } from "node:crypto";
          import fs from "node:fs";

          const endpoint = process.env.SUPABASE_URL + "/functions/v1/mia-perception-ingress-test";
          const secret = process.env.SUPABASE_SECRET_KEY;
          if (!secret) throw new Error("Missing repository secret ZEE_PREDICTION_SECRET_KEY.");
          const sourceId = randomUUID();
          const keyId = "ci-" + randomUUID();
          const frameId = "ci-perception-frame";
          const { publicKey, privateKey } = generateKeyPairSync("ed25519");
          const publicDer = publicKey.export({ format: "der", type: "spki" });
          const publicRaw = publicDer.subarray(publicDer.length - 32);
          const publicKeyB64 = publicRaw.toString("base64url");
          const results = [];

          async function call(body, auth = true) {
            const headers = { "content-type": "application/json" };
            if (auth) headers.apikey = secret;
            const response = await fetch(endpoint, { method: "POST", headers, body: JSON.stringify(body) });
            let data = {}; try { data = await response.json(); } catch {}
            return { status: response.status, data };
          }
          function check(name, pass, detail) {
            results.push({ name, pass, detail });
            console.log(`${pass ? "PASS" : "FAIL"} ${name}: ${JSON.stringify(detail)}`);
            if (!pass) process.exitCode = 1;
          }
          function signed(payloadObject, { eventId = "evt-" + randomUUID(), nonce = randomBytes(18).toString("base64url"),
            observedAt = new Date().toISOString() } = {}) {
            const payload = Buffer.from(JSON.stringify(payloadObject));
            const hash = createHash("sha256").update(payload).digest("hex");
            const envelope = ["ZHI-MIA-PERCEPTION-V1", sourceId, keyId, eventId, observedAt, nonce, hash].join("\n");
            const signature = sign(null, Buffer.from(envelope), privateKey).toString("base64url");
            return {
              test_only: true, source_id: sourceId, key_id: keyId, event_id: eventId,
              observed_at: observedAt, nonce, payload_b64url: payload.toString("base64url"),
              signature_b64url: signature
            };
          }

          const unauth = await call({ test_only: true, intent: "register_test_source", source_id: sourceId,
            key_id: keyId, public_key_b64url: publicKeyB64 }, false);
          check("unauthenticated-fixture-registration-denied", [401,403].includes(unauth.status), { http: unauth.status });

          const registered = await call({ test_only: true, intent: "register_test_source", source_id: sourceId,
            key_id: keyId, public_key_b64url: publicKeyB64 });
          check("ephemeral-ed25519-source-registered", registered.status === 201 &&
            registered.data.source_id === sourceId && registered.data.fixture_only === true &&
            registered.data.physical_sensor === false && registered.data.action_authorized === false,
            { http: registered.status, data: registered.data });

          const validBody = signed({ frame_id: frameId, coordinates: { x: 2, y: 3 }, fixture: "synthetic-only" });
          const valid = await call(validBody);
          check("valid-signature-hash-and-fixture-coordinate-map", valid.status === 200 &&
            valid.data.ingress?.signature_status === "verified" &&
            valid.data.ingress?.disposition === "accepted" &&
            valid.data.observation?.mapping_status === "mapped" &&
            valid.data.observation?.mapped_frame_id === "ci-fixture-calibrated-frame" &&
            valid.data.observation?.mapped_coordinates?.x === 12 &&
            valid.data.observation?.mapped_coordinates?.y === 23 &&
            valid.data.evidence_semantics?.world_truth_claim === false &&
            valid.data.evidence_semantics?.physical_measurement === false &&
            valid.data.evidence_semantics?.action_authorized === false &&
            valid.data.evidence_semantics?.action_executor_called === false,
            { http: valid.status, ingress: valid.data.ingress, observation: valid.data.observation,
              semantics: valid.data.evidence_semantics });

          const tampered = signed({ frame_id: frameId, coordinates: { x: 4, y: 5 } });
          tampered.payload_b64url = Buffer.from(JSON.stringify({
            frame_id: frameId, coordinates: { x: 400, y: 500 }
          })).toString("base64url");
          const tamperResult = await call(tampered);
          check("payload-tamper-signature-rejected", tamperResult.status === 422 &&
            tamperResult.data.ingress?.signature_status === "invalid" &&
            tamperResult.data.ingress?.disposition === "rejected",
            { http: tamperResult.status, ingress: tamperResult.data.ingress });

          const stale = signed({ frame_id: frameId, coordinates: { x: 1, y: 1 } },
            { observedAt: new Date(Date.now() - 10 * 60 * 1000).toISOString() });
          const staleResult = await call(stale);
          check("stale-timestamp-rejected", staleResult.status === 422 &&
            staleResult.data.ingress?.freshness_status === "stale" &&
            staleResult.data.ingress?.disposition === "stale",
            { http: staleResult.status, ingress: staleResult.data.ingress });

          const replayNonce = randomBytes(18).toString("base64url");
          const firstReplayEnvelope = signed({ frame_id: frameId, coordinates: { x: 5, y: 6 } },
            { nonce: replayNonce });
          const firstReplay = await call(firstReplayEnvelope);
          const secondReplay = await call(signed({ frame_id: frameId, coordinates: { x: 6, y: 7 } },
            { nonce: replayNonce }));
          check("nonce-replay-detected-and-audited", firstReplay.status === 200 &&
            firstReplay.data.ingress?.disposition === "accepted" &&
            secondReplay.status === 422 && secondReplay.data.ingress?.disposition === "replay" &&
            secondReplay.data.ingress?.decision_reason === "nonce_replay",
            { first: firstReplay.data.ingress, second: secondReplay.data.ingress });

          const unknownFrame = await call(signed({ frame_id: "not-allowlisted-frame", coordinates: { x: 8, y: 9 } }));
          check("unallowlisted-source-frame-rejected", unknownFrame.status === 422 &&
            unknownFrame.data.ingress?.decision_reason === "source_frame_not_allowlisted" &&
            unknownFrame.data.observation === null,
            { http: unknownFrame.status, ingress: unknownFrame.data.ingress, observation: unknownFrame.data.observation });

          const revoked = await call({ test_only: true, intent: "revoke_test_source", source_id: sourceId, key_id: keyId });
          const afterRevoke = await call(signed({ frame_id: frameId, coordinates: { x: 1, y: 2 } }));
          check("revoked-source-rejected", revoked.status === 200 && revoked.data.revoked === true &&
            afterRevoke.status === 401 && afterRevoke.data.error === "source_inactive",
            { revoke: revoked.data, after_revoke: afterRevoke.data });

          const summary = [
            "# MIA perception ingress HTTP test",
            "",
            `Result: ${results.every(x => x.pass) ? "PASS" : "FAIL"}`,
            "",
            "| Test | Result | Detail |",
            "|---|---|---|",
            ...results.map(x => `| ${x.name} | ${x.pass ? "PASS" : "FAIL"} | \`${JSON.stringify(x.detail).replaceAll("|", "\\|")}\` |`),
            "",
            "Target: zee-prediction / mia-perception-ingress-test. The Ed25519 private key is generated in-memory and never stored.",
            "The coordinate frame and affine transform are synthetic CI fixtures, not physical calibration or real-world perception.",
            "No action authorization is granted and no action executor is called."
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + "\\n");
          if (results.some(x => !x.pass)) process.exitCode = 1;
          NODE
