name: ZPCL Reference Engine Tests

on:
  push:
    branches: ["feat/zpcl-engine-v1"]
    paths:
      - "zpcl/**"
      - ".github/workflows/zpcl-tests.yml"
  pull_request:
    paths:
      - "zpcl/**"
      - ".github/workflows/zpcl-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zpcl-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run standard-library test suite
        run: python -m unittest discover -s zpcl/tests -v
