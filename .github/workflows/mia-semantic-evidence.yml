name: Mia semantic evidence contracts

on:
  pull_request:
    paths:
      - "supabase/functions/_shared/mia-semantic-evidence.ts"
      - "supabase/functions/mia-semantic-evidence-test/**"
      - ".github/workflows/mia-semantic-evidence.yml"
  push:
    branches:
      - "mia/semantic-action-evidence-v1"
    paths:
      - "supabase/functions/_shared/mia-semantic-evidence.ts"
      - "supabase/functions/mia-semantic-evidence-test/**"
      - ".github/workflows/mia-semantic-evidence.yml"

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Run isolated contract tests
        run: node --experimental-strip-types --test supabase/functions/mia-semantic-evidence-test/index_test.ts
