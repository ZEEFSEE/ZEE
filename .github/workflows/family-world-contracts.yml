name: Verify ZHI family public-world contracts

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/family-world-contracts.yml"
      - "mia-digital-family/family-public-world-access.v1.json"
      - "mia-digital-family/runtime/family-public-world-runtime-adapter.mjs"
      - "mia-digital-family/tests/family-public-world-runtime-adapter.test.mjs"
      - "mia-digital-family/PUBLIC-WORLD-ACCESS.md"
      - "mia-digital-family/tests/family-world-catalog.test.mjs"
      - "supabase/functions/zhi-family-world-runtime/index.ts"
      - "supabase/functions/mia-forest-autonomy/index.ts"
      - "world-scenes/public-destinations/validate-palace-server-runtime.test.mjs"
      - "zhi-family-world.html"
      - "world-scenes/public-destinations/**"
      - "world-scenes/runtime/mia-public-world-runtime.mjs"
      - "world-scenes/runtime/mia-public-world-runtime.test.mjs"
      - "world-scenes/validate-public-destinations.mjs"
  pull_request:
    paths:
      - ".github/workflows/family-world-contracts.yml"
      - "mia-digital-family/family-public-world-access.v1.json"
      - "mia-digital-family/runtime/family-public-world-runtime-adapter.mjs"
      - "mia-digital-family/tests/family-public-world-runtime-adapter.test.mjs"
      - "world-scenes/public-destinations/**"
      - "world-scenes/runtime/mia-public-world-runtime.mjs"
      - "world-scenes/validate-public-destinations.mjs"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify family public-world grants and runtime contract
        run: node --test mia-digital-family/tests/family-public-world-runtime-adapter.test.mjs
      - name: Verify family world scene catalog and bidirectional portals
        run: node --test mia-digital-family/tests/family-world-catalog.test.mjs
      - name: Verify world spatial contracts
        run: node --test world-scenes/runtime/mia-public-world-runtime.test.mjs
      - name: Verify Mia-world free-passage runtime adapter
        run: node --test world-scenes/public-destinations/mia-public-destination-runtime-adapter.test.mjs
      - name: Verify static public destination catalog
        run: node world-scenes/validate-public-destinations.mjs
      - name: Verify Palace server runtime open-access contract
        run: node --test world-scenes/public-destinations/validate-palace-server-runtime.test.mjs
