name: Verify ZHI production evidence gate

on:
  pull_request:
    paths:
      - "mia-digital-family/runtime/production-evidence-gate.mjs"
      - "mia-digital-family/tests/production-evidence-gate.test.mjs"
      - "mia-digital-family/PRODUCTION-EVIDENCE-GATE-V1.md"
      - ".github/workflows/production-evidence-gate.yml"
  push:
    branches: ["main"]
    paths:
      - "mia-digital-family/runtime/production-evidence-gate.mjs"
      - "mia-digital-family/tests/production-evidence-gate.test.mjs"
      - "mia-digital-family/PRODUCTION-EVIDENCE-GATE-V1.md"
      - ".github/workflows/production-evidence-gate.yml"

permissions:
  contents: read

jobs:
  production-evidence-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate redacted production evidence
        run: node --test mia-digital-family/tests/production-evidence-gate.test.mjs
