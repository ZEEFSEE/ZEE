name: Forest Corner card dry-run

on:
  push:
    branches:
      - work/forest-corner-card-dry-run-v1
    paths:
      - docs/mia/forest-corner-card-dry-run.mjs
      - docs/mia/forest-corner-card-dry-run.md
      - docs/mia/forest-corner-private-channel-auth-audit-v1.1.md
      - docs/mia/forest-corner-private-card-service-design-v1.2.md
      - docs/mia/forest-corner-private-card-vault-migration-proposal-v1.2.sql
      - docs/mia/forest-corner-private-card-sql-review-v1.2.md
      - docs/mia/forest-corner-sql-static-audit.mjs
      - docs/mia/forest-corner-private-card-vault-migration-proposal-v1.3.sql
      - docs/mia/forest-corner-private-card-sql-review-v1.3.md
      - docs/mia/forest-corner-sql-static-audit-v1.3.mjs
      - docs/mia/forest-corner-private-card-service-design-v1.3.md
      - .github/workflows/forest-corner-card-dry-run.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forest_corner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forest_corner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run synthetic-only contract tests
        run: node docs/mia/forest-corner-card-dry-run.mjs
      - name: Run V1.2 SQL proposal static guard (not a database test)
        run: node docs/mia/forest-corner-sql-static-audit.mjs
      - name: Run V1.3 SQL proposal static guard (not a database test)
        run: node docs/mia/forest-corner-sql-static-audit-v1.3.mjs
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap Supabase-like roles in disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d forest_corner_test -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN BYPASSRLS;"
      - name: Execute proposal in disposable PostgreSQL service
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d forest_corner_test -v ON_ERROR_STOP=1 -f docs/mia/forest-corner-private-card-vault-migration-proposal-v1.3.sql
      - name: Run synthetic PostgreSQL privilege and transaction smoke tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d forest_corner_test -v ON_ERROR_STOP=1 -f docs/mia/forest-corner-postgres-smoke-test-v1.3.sql
