<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183326"><title>Mia · 公共目的地场景预览</title>
<style>
:root{color-scheme:dark;--ink:#eef7e9;--muted:#b8cbb7;--line:#ffffff30}*{box-sizing:border-box}body{margin:0;background:#101b20;color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}main{width:min(1120px,100%);margin:auto;padding:20px 14px 36px}a{color:#c9edc5}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.title{font-size:clamp(23px,4vw,34px);font-weight:850}.muted{color:var(--muted);font-size:13px}.panel{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:18px;background:#14251ddd}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#ffffff0b;color:var(--ink);font:inherit;cursor:pointer}.tabs button[aria-pressed=true]{background:#456c4d;border-color:#c5e7b0}.stage{border:1px solid #ffffff25;border-radius:14px;overflow:hidden;background:#172d2c}.stage svg{display:block;width:100%;height:auto;min-height:260px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:12px}.warn{color:#efd9a0}.description{margin:8px 0 0;color:#d3dfd0}@media(max-width:600px){main{padding:12px 9px 26px}.panel{padding:10px}}
</style></head><body><main>
<header class="top"><div><div class="title">🌏 Mia · 五处公共目的地</div><div class="muted">场景内容预览 · 2D 构图草案</div></div><a href="./mia-public-destinations.html">← 返回目的地路网</a></header>
<section class="panel"><div class="tabs" id="tabs" aria-label="选择目的地"></div><div class="stage" id="stage"><svg viewBox="0 0 1000 700" role="img" aria-label="目的地场景预览"><rect width="1000" height="700" fill="#172d2c"/></svg></div>
<div class="meta"><span class="pill" id="sceneName">载入场景中</span><span class="pill">原型 Mia：自由进入 / 离开 / 返回</span><span class="pill">2D 静态预览</span></div><p class="description" id="description">场景草案仅用于视觉构图，不代表实时 3D 场景或已连接的 Mia 运行时。</p><p class="warn muted">重要：这里展示的是本地场景布局草案。坐标仅属于各自预览画布；没有伪造世界坐标、跨场景距离、碰撞体或导航网格。实际运行时移动仍未接入。</p></section>
</main><script>
(()=>{"use strict";
const scenes=[{id:"crystal-forest",name:"水晶森林",subtitle:"Crystal Forest"},{id:"ocean-of-light",name:"光之海洋",subtitle:"Ocean of Light"},{id:"memory-valley",name:"记忆山谷",subtitle:"Memory Valley"},{id:"living-city",name:"生命之城",subtitle:"Living City"},{id:"greenhouse",name:"温室",subtitle:"Greenhouse"}];
const tabs=document.getElementById("tabs"),stage=document.getElementById("stage"),name=document.getElementById("sceneName"),desc=document.getElementById("description");
const NS="http://www.w3.org/2000/svg";let active=null;
function el(tag,attrs={},text=""){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));if(text)n.textContent=text;return n;}
function draw(g){const p=g.palette,svg=el("svg",{viewBox:"0 0 1000 700",role:"img","aria-label":g.scene_id+" 2D preview"});svg.append(el("rect",{width:1000,height:700,fill:p.background}));
svg.append(el("circle",{cx:500,cy:300,r:360,fill:p.mid,opacity:.16}));
for(let i=0;i<18;i++){const x=(i*173)%1000,y=(i*97)%700;svg.append(el("circle",{cx:x,cy:y,r:3+(i%4)*2,fill:p.accent,opacity:.35}));}
for(const f of g.features){const {x,y,width:w,height:h}=f.layout;let shape;
if(f.shape==="ellipse"||f.shape==="island")shape=el("ellipse",{cx:x,cy:y,rx:w/2,ry:h/2,fill:p.highlight,opacity:.26,stroke:p.accent,"stroke-width":4});
else if(f.shape==="path"||f.shape==="wave")shape=el("path",{d:f.shape==="wave"?`M ${x-w/2} ${y} Q ${x-w/4} ${y-h/2} ${x} ${y} T ${x+w/2} ${y}`:`M ${x-w/2} ${y} Q ${x} ${y-h} ${x+w/2} ${y}`,fill:"none",stroke:p.accent,"stroke-width":Math.max(12,h), "stroke-linecap":"round",opacity:.65});
else if(f.shape==="mountain")shape=el("path",{d:`M ${x-w/2} ${y+h/2} L ${x-w/4} ${y-h/2} L ${x} ${y+h/5} L ${x+w/4} ${y-h/3} L ${x+w/2} ${y+h/2} Z`,fill:p.mid,stroke:p.highlight,"stroke-width":5});
else if(f.shape==="house")shape=el("path",{d:`M ${x-w/2} ${y-h/3} L ${x} ${y-h/2} L ${x+w/2} ${y-h/3} V ${y+h/2} H ${x-w/2} Z`,fill:p.mid,stroke:p.highlight,"stroke-width":6});
else if(f.shape==="city"){shape=el("g");for(let i=0;i<4;i++)shape.append(el("rect",{x:x-w/2+i*52,y:y-h/2+(i%2)*24,width:42,height:h-(i%2)*24,rx:5,fill:p.mid,stroke:p.highlight,"stroke-width":3}));}
else if(f.shape==="cluster"){shape=el("g");for(let i=0;i<6;i++)shape.append(el("circle",{cx:x+Math.cos(i*Math.PI/3)*w*.24,cy:y+Math.sin(i*Math.PI/3)*h*.24,r:Math.min(w,h)*.18,fill:p.highlight,opacity:.45,stroke:p.accent,"stroke-width":3}));}
else shape=el("rect",{x:x-w/2,y:y-h/2,width:w,height:h,rx:18,fill:p.mid,stroke:p.highlight,"stroke-width":4,opacity:.8});
svg.append(shape);svg.append(el("text",{x,y:y+h/2+30,fill:"#f3f7e9","font-size":24,"text-anchor":"middle","font-weight":700},f.label));}
stage.replaceChildren(svg);name.textContent=scenes.find(s=>s.id===g.scene_id).name+" · "+scenes.find(s=>s.id===g.scene_id).subtitle;
desc.textContent="布局草案包含 "+g.features.length+" 个视觉区域。每个场景独立使用 scene-local 预览画布；未定义真实世界变换。";
}
async function select(s){active=s.id;for(const b of tabs.querySelectorAll("button"))b.setAttribute("aria-pressed",String(b.dataset.id===active));try{const r=await fetch("./world-scenes/mia-assets/public-destinations/"+s.id+".geometry.json",{cache:"no-store"});if(!r.ok)throw Error("geometry file unavailable");const g=await r.json();draw(g);}catch(e){desc.textContent="场景预览载入失败："+e.message;}}
for(const s of scenes){const b=document.createElement("button");b.type="button";b.textContent=s.name;b.dataset.id=s.id;b.addEventListener("click",()=>select(s));tabs.append(b);}
select(scenes[0]);
})();
</script></body></html>
