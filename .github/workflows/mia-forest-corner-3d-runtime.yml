name: Mia Forest Corner 3D Runtime Contract

on:
  pull_request:
    paths:
      - "mia-prototype-runtime.html"
      - "world-scenes/runtime/mia-forest-corner-3d.*"
      - "world-scenes/runtime/mia-forest-observation-frame.*"
      - "world-scenes/runtime/mia-scene-asset-loader.*"
      - "world-scenes/mia-assets/**"
      - "mia/forest-corner.json"
      - ".github/workflows/mia-forest-corner-3d-runtime.yml"
  push:
    branches: [main]
    paths:
      - "mia-prototype-runtime.html"
      - "world-scenes/runtime/mia-forest-corner-3d.*"
      - "world-scenes/runtime/mia-forest-observation-frame.*"
      - "world-scenes/runtime/mia-scene-asset-loader.*"
      - "world-scenes/mia-assets/**"
      - "mia/forest-corner.json"
      - ".github/workflows/mia-forest-corner-3d-runtime.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate HTML module references
        run: |
          grep -q 'mia-forest-corner-3d.mjs' mia-prototype-runtime.html
          grep -q 'mia-forest-observation-frame.mjs' mia-prototype-runtime.html
          grep -q 'mia-scene-asset-loader.mjs' mia-prototype-runtime.html
          grep -q 'three@0.170.0' mia-prototype-runtime.html
          ! grep -Eq 'service_role|AGNES_API_KEY|mia-chat' mia-prototype-runtime.html
      - name: Run scene contract tests
        run: node --test world-scenes/runtime/mia-forest-corner-3d.test.mjs world-scenes/runtime/mia-forest-observation-frame.test.mjs world-scenes/runtime/mia-scene-asset-loader.test.mjs
