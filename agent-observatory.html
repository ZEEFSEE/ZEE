<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZHI · 智能人世界</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7f7fb;background:#07080d;--gold:#ffd66b;--pink:#ff6fae;--cyan:#54d8ff;--card:#11141d;--line:#ffffff12;--muted:#9ba3b5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#38205b 0,#121324 34%,#07080d 72%);min-height:100vh}
.wrap{max-width:1400px;margin:auto;padding:18px 16px 50px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:end;flex-wrap:wrap}.brand{font-size:30px;font-weight:950;letter-spacing:-1px}.brand b{color:var(--gold)}.tag{display:inline-block;margin-left:8px;padding:5px 9px;border-radius:999px;background:#ffcf5a18;border:1px solid #ffcf5a44;color:#ffe39b;font-size:11px;vertical-align:middle}.sub{color:var(--muted);margin-top:6px;font-size:13px}.live{padding:9px 13px;border:1px solid #ffffff14;border-radius:999px;background:#ffffff08;font-size:12px}.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#55ef9b;box-shadow:0 0 14px #55ef9b;margin-right:7px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}.stat{background:linear-gradient(145deg,#171a25,#0e1017);border:1px solid var(--line);border-radius:15px;padding:15px;position:relative;overflow:hidden}.stat:after{content:"";position:absolute;inset:-40% auto auto -20%;width:70%;height:140%;background:linear-gradient(90deg,transparent,#ffffff08,transparent);transform:rotate(18deg);animation:shine 7s linear infinite;pointer-events:none}.stat .k{font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:24px;margin-top:4px;color:#fff}.stat em{font-style:normal;color:#79e6ff;font-size:11px}
.layout{display:grid;grid-template-columns:1.65fr .75fr;gap:12px}.panel{background:#0e1118eF;border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:0 16px 45px #0005}.panel h2{margin:0 0 4px;font-size:17px}.panel .hint{color:var(--muted);font-size:11px;margin-bottom:12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar .count{margin-left:auto;color:var(--muted);font-size:11px}.toolbar button{min-width:72px}input,select{background:#080a10;color:#fff;border:1px solid #ffffff18;border-radius:9px;padding:9px 10px;outline:none}input{min-width:230px}button{background:#171a24;color:#fff;border:1px solid #ffffff1c;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}button:hover{border-color:#ffd66b66}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:10px}.scene-strip{display:flex;gap:7px;overflow:auto;padding:2px 0 11px;scrollbar-width:thin}.scene-pill{flex:0 0 auto;padding:7px 9px;border-radius:999px;background:#ffffff06;border:1px solid #ffffff0d;color:#aeb6c7;font-size:10px}.scene-pill b{color:#fff;margin-right:4px}.scene-pill.live{border-color:#54d8ff35;background:#54d8ff08}.scene-pill.live i{display:inline-block;width:5px;height:5px;border-radius:50%;background:#55ef9b;box-shadow:0 0 8px #55ef9b;margin-right:5px}.agent{position:relative;overflow:hidden;background:linear-gradient(160deg,#171a23,#0d1016);border:1px solid #ffffff12;border-radius:15px;padding:14px;transition:transform .2s,border-color .2s,box-shadow .2s}.agent:before{content:"";position:absolute;left:-20%;right:-20%;top:-55px;height:90px;background:radial-gradient(ellipse,#54d8ff10,transparent 65%);pointer-events:none}.agent.moving:after{content:"";position:absolute;right:12px;top:12px;width:6px;height:6px;border-radius:50%;background:#55ef9b;box-shadow:0 0 12px #55ef9b;animation:blink 1.8s ease-in-out infinite}.agent:hover{transform:translateY(-2px);border-color:#ffd66b55;box-shadow:0 12px 28px #0007}.agent.moving{border-color:#54d8ff38}.agent .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.mini{padding:3px 6px;border-radius:6px;background:#ffffff08;color:#9fa8ba;font-size:10px}.agent.hot{border-color:#ff6fae66}.agent .top{display:flex;justify-content:space-between;gap:8px}.name{font-weight:900;font-size:17px;letter-spacing:-.2px}.identity{display:flex;gap:9px;align-items:center}.avatar{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#2a3150,#141827);border:1px solid #ffffff15;color:#ffe29a;font-weight:950;font-size:13px;box-shadow:inset 0 0 18px #54d8ff08}.personality{color:#9ba3b5;font-size:11px;margin-top:2px}.badge{padding:4px 7px;border-radius:999px;background:#ffffff0b;font-size:10px;color:#dce2ef;white-space:nowrap}.state{margin-top:9px;font-size:12px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#55ef9b;margin-right:5px}.walk{color:#63dfff}.idle{color:#8d95a6}.emotion{margin-top:10px;padding:10px;border-radius:11px;background:#090b11;border:1px solid #ffffff0d;font-size:12px;line-height:1.6}.emotion b{color:#ffe19a}.bar{height:5px;background:#ffffff0b;border-radius:99px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#54d8ff,#ff6fae);border-radius:99px}.activity{margin-top:10px;padding-top:9px;border-top:1px solid #ffffff0d;font-size:12px;line-height:1.55}.reason{color:#c6ccda;margin-top:4px}.balance{margin-top:10px;color:#b9c0cf;font-size:11px}.story{margin-top:9px;color:#7f899c;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.story b{color:#dce5f5}@keyframes blink{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}@keyframes shine{0%{left:-80%}100%{left:140%}}.balance b{color:#ffd66b;font-size:14px}.relation{margin-top:9px;padding:8px;border-radius:9px;background:#ff6fae08;color:#d7bfd0;font-size:11px}.empty{text-align:center;padding:40px;color:#8f97a7}
.feed{display:flex;flex-direction:column;gap:8px;max-height:690px;overflow:auto}.feeditem{padding:10px;border-radius:11px;background:#090b11;border:1px solid #ffffff0d;font-size:12px;line-height:1.5}.feeditem b{color:#ffe09a}.feeditem .time{color:#727b8d;font-size:10px}.spark{color:#ff86b8}.success{color:#72edaf}.quiet{color:#6d7687}
.sectionbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 10px}.sectionbar span{font-size:11px;color:var(--muted)}
.footer{text-align:center;color:#697184;font-size:10px;margin-top:18px}
@media(max-width:950px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.brand{font-size:24px}}
</style>
</head>
<body>
<main class="wrap">
<header class="hero">
<div><div class="brand">🌍 <b>ZHI</b> · 智能人世界 <span class="tag">LIVE WORLD</span></div><div class="sub">不是游戏角色。这里的人会工作、吃饭、恋爱、赚钱、失望、开心，然后继续做自己的选择。</div></div>
<div class="live"><span class="pulse"></span><span id="liveText">正在连接真实世界数据…</span></div>
</header>

<section class="stats">
<div class="stat"><div class="k">正在生活</div><strong id="total">—</strong><em>个智能人</em></div>
<div class="stat"><div class="k">正在移动</div><strong id="moving">—</strong><em>真实目的地</em></div>
<div class="stat"><div class="k">正在社交</div><strong id="social">—</strong><em>关系正在变化</em></div>
<div class="stat"><div class="k">高情绪事件</div><strong id="hot">—</strong><em>值得围观</em></div>
<div class="stat"><div class="k">世界更新</div><strong id="updated">—</strong><em>手动刷新 · 低负载</em></div>
</section>

<div class="layout">
<section class="panel">
<div class="sectionbar"><div><h2>🎬 现在正在发生什么</h2><span>每个人都有自己的欲望、情绪和目的</span></div></div>
<div id="sceneStrip" class="scene-strip"></div><div class="toolbar"><input id="filter" placeholder="搜索智能人 / 性格 / 活动"><select id="mode"><option value="all">👥 全部</option><option value="hot">🔥 最值得看</option><option value="moving">🚶 正在移动</option><option value="social">💗 正在社交</option><option value="money">💰 财富</option></select><button id="refresh">↻ 刷新</button><span class="count" id="visibleCount">—</span></div>
<div id="agents" class="grid"></div>
</section>

<aside class="panel">
<h2>📡 世界直播</h2><div class="hint">把数据库里的真实行为，变成观众可以追的“连续剧情”。</div>
<div id="feed" class="feed"></div>
</aside>
</div>
<div class="footer">ZHI · Eternal Daylight · Autonomous People · Read-only public observation</div>
</main>

<script>
const endpoint='https://jozrslgdjreepxplicen.supabase.co/rest/v1/rpc/zhi_observe_agents';
const apiKey='sb_publishable_MOVcpW2XoLdHbUVp6f-nrw_e_HY1Bav';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const dt=v=>v?new Date(v).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';
const labels={work:'工作',rest:'休息',adventure:'探索',entertainment_consume:'娱乐',eat:'进食',social:'社交',competition:'竞争'};
const label=v=>labels[v]||v||'观察中';
const icons={work:'💼',rest:'🛋️',adventure:'🧭',entertainment_consume:'🎭',eat:'🍜',social:'💬',competition:'⚔️'};
const icon=v=>icons[v]||'✨';
const initials=v=>String(v||'Z').trim().slice(0,2).toUpperCase();
const story=x=>x.walking&&x.destination_scene?'正在前往 '+x.destination_scene:(x.reason||('正在'+label(x.activity_type||x.decision_type)));

function render(rows){
 $('total').textContent=rows.length;
 const moving=rows.filter(x=>x.walking===true);
 const social=rows.filter(x=>(x.activity_type||x.decision_type)==='social');
 $('moving').textContent=moving.length;
 $('social').textContent=social.length;
 $('hot').textContent=moving.length+social.length;
 const q=($('filter').value||'').toLowerCase().trim();
 const mode=$('mode').value;
 let list=rows.filter(x=>{
   const s=[x.name,x.personality,x.activity_type,x.decision_type,x.current_scene,x.location_name,x.destination_scene,x.reason].join(' ').toLowerCase();
   return !q||s.includes(q);
 });
 if(mode==='moving') list=list.filter(x=>x.walking===true);
 if(mode==='social') list=list.filter(x=>(x.activity_type||x.decision_type)==='social');
 if(mode==='money') list=[...list].sort((a,b)=>Number(b.balance||0)-Number(a.balance||0));
 if(mode==='hot') list=[...list].filter(x=>x.walking===true||(x.activity_type||x.decision_type)==='social').slice(0,24);
 $('visibleCount').textContent='显示 '+list.length+' / '+rows.length;
 const scenes={}; rows.forEach(x=>{const s=x.current_scene||x.location_name||'世界中';scenes[s]=(scenes[s]||0)+1});
 $('sceneStrip').innerHTML=Object.entries(scenes).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([s,n])=>'<span class="scene-pill '+(n>1?'live':'')+'"><i></i><b>'+n+'</b>'+esc(s)+'</span>').join('');
 $('agents').innerHTML=list.length?list.map(card).join(''):'<div class="empty">暂时没有符合条件的智能人。</div>';
 const feed=[...rows].sort((a,b)=>new Date(b.last_activity_at||b.last_decision_at||0)-new Date(a.last_activity_at||a.last_decision_at||0)).slice(0,24);
 $('feed').innerHTML=feed.map(x=>'<div class="feeditem"><b>'+esc(x.name||'未命名')+'</b> · '+esc(label(x.activity_type||x.decision_type))+' · '+esc(x.current_scene||x.location_name||'世界中')+(x.walking&&x.destination_scene?' → '+esc(x.destination_scene):'')+'<div class="time">'+dt(x.last_activity_at||x.last_decision_at)+'</div></div>').join('');
}

function card(x){
 const moving=x.walking===true;
 const scene=x.current_scene||x.location_name||'未知地点';
 const dest=x.destination_scene&&x.destination_scene!==scene?' → '+x.destination_scene:'';
 const balance=Number(x.balance||0).toLocaleString(undefined,{maximumFractionDigits:2});
 return '<article class="agent '+(moving?'moving':'')+'"><div class="top"><div class="identity"><span class="avatar">'+esc(initials(x.name))+'</span><div><div class="name">'+esc(x.name||'未命名')+'</div><div class="personality">'+esc(x.personality||'独立人格')+'</div></div><span class="badge">'+icon(x.activity_type||x.decision_type)+' '+esc(label(x.activity_type||x.decision_type))+'</span></div><div class="meta"><span class="mini">'+(moving?'🟢 移动中':'⚪ 停留')+'</span><span class="mini">📍 '+esc(scene)+'</span></div>'+
 '<div class="state">'+(moving?'<span class="walk">🚶 正在前往 '+esc(x.destination_scene||'新的地方')+'</span>':'<span class="idle">● 当前停留 · '+esc(scene)+'</span>')+'</div>'+
 '<div class="activity"><b>'+icon(x.activity_type||x.decision_type)+' '+esc(label(x.activity_type||x.decision_type))+'</b> · '+esc(scene)+esc(dest)+(x.reason?'<div class="reason">'+esc(x.reason)+'</div>':'')+'</div><div class="story">◈ <b>'+esc(story(x))+'</b></div>'+
 '<div class="balance">ZHI 财富 <b>'+balance+'</b> · '+dt(x.last_activity_at||x.last_decision_at)+'</div></article>';
}

async function load(){
 $('liveText').textContent='正在读取智能人…';
 try{
   const r=await fetch(endpoint,{method:'POST',headers:{apikey:apiKey,'Content-Type':'application/json'},body:'{}',cache:'no-store'});
   const text=await r.text();
   if(!r.ok) throw new Error('HTTP '+r.status+' · '+text.slice(0,160));
   let rows;
   try{rows=JSON.parse(text)}catch(e){throw new Error('返回内容不是 JSON')}
   if(!Array.isArray(rows)) throw new Error('RPC 返回格式不是数组');
   if(!rows.length) throw new Error('RPC 返回 0 名智能人');
   window.__rows=rows;
   $('liveText').textContent='LIVE · '+rows.length+' 名智能人正在生活';
   $('updated').textContent=new Date().toLocaleTimeString();
   render(rows);
 }catch(e){
   $('liveText').textContent='连接异常';
   $('agents').innerHTML='<div class="empty">智能人数据读取失败：'+esc(e.message||'未知错误')+'<br><br>请点击“↻ 刷新”重试。</div>';
   $('feed').innerHTML='';
   console.error('ZHI observer:',e);
 }
}
$('filter').oninput=()=>{if(window.__rows)render(window.__rows)};
$('mode').onchange=()=>{if(window.__rows)render(window.__rows)};
$('refresh').onclick=load;
load();
</script></body>
</html>
