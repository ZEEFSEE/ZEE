<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17251f"><title>Mia 森林角落 · 石板小路测试预览</title>
<style>
:root{color-scheme:dark;--ink:#edf5ec;--muted:#b8c8b8;--line:#ffffff2a;--panel:#16231dcc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#355642 0,#15271f 45%,#0a1511 100%);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}main{width:min(1080px,100%);margin:auto;padding:22px 14px 40px}a{color:#c4e8c7}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.title{font-size:clamp(23px,4vw,34px);font-weight:850}.muted{color:var(--muted);font-size:13px}.panel{margin-top:15px;padding:15px;border:1px solid var(--line);border-radius:17px;background:var(--panel);box-shadow:0 12px 40px #0002}.map-wrap{overflow:hidden;border-radius:13px;border:1px solid #b8d5b133;background:#122219}.map{display:block;width:100%;height:auto}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:1px solid #ffffff3a;border-radius:10px;padding:9px 12px;background:#ffffff12;color:var(--ink);font:inherit;cursor:pointer}button[aria-pressed=true]{background:#426b4c;border-color:#8bc895}.status{white-space:pre-wrap;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.metric{padding:10px;border:1px solid var(--line);border-radius:12px}.metric strong{display:block;font-size:17px}.warn{color:#f1d99b}.good{color:#b9e9c0}.foot{font-size:12px;color:var(--muted)}@media(max-width:600px){main{padding:14px 9px 28px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><main>
<header class="top"><div><div class="title">🍃 森林角落 · 自然石板小路</div><div class="muted">独立静态测试预览 · scene_local · 不修改生产场景</div></div><a href="./mia-world.html">返回 Mia 世界</a></header>
<section class="panel"><div class="map-wrap"><svg id="map" class="map" viewBox="0 0 1000 700" role="img" aria-label="五块独立自然石板从左侧测试入口延伸至休息区">
<defs><linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#294a35"/><stop offset=".52" stop-color="#1a3828"/><stop offset="1" stop-color="#10271d"/></linearGradient><linearGradient id="stone" x1="0" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#9ba99a"/><stop offset=".45" stop-color="#687c6b"/><stop offset="1" stop-color="#425847"/></linearGradient><pattern id="moss" width="42" height="38" patternUnits="userSpaceOnUse"><circle cx="8" cy="9" r="2" fill="#b4d18c" opacity=".42"/><circle cx="28" cy="25" r="3" fill="#6b9c60" opacity=".45"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="6"/><feComponentTransfer><feFuncA type="linear" slope=".4"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1000" height="700" fill="url(#ground)"/><g opacity=".3" fill="#6d9c62"><circle cx="70" cy="105" r="44"/><circle cx="165" cy="580" r="55"/><circle cx="360" cy="90" r="45"/><circle cx="535" cy="590" r="58"/><circle cx="700" cy="95" r="50"/><circle cx="930" cy="535" r="64"/><circle cx="940" cy="170" r="45"/></g><g opacity=".28" stroke="#bdd1a5" fill="none"><path d="M0 210Q200 180 350 220T700 210T1000 235"/><path d="M0 500Q250 470 470 510T1000 490"/><path d="M100 0Q135 130 100 250T120 700"/><path d="M860 0Q820 160 870 330T840 700"/></g>
<g id="slabs" filter="url(#shadow)"></g><g id="colliders" style="display:none" fill="#ff9d5c" fill-opacity=".22" stroke="#ffb27e" stroke-width="3" stroke-dasharray="8 5"></g><g id="route" fill="none" stroke="#f4e8b0" stroke-width="3" stroke-dasharray="7 9" opacity=".75"><path d="M5 350H795"/></g>
<g><circle cx="12" cy="350" r="12" fill="#e9f3d1" stroke="#253e2b" stroke-width="5"/><text x="28" y="315" fill="#f0f8e9" font-size="23" font-weight="700">测试入口 (0,350)</text><circle cx="800" cy="350" r="17" fill="#e7b5d4" stroke="#fff0f8" stroke-width="4"/><text x="800" y="302" text-anchor="middle" fill="#fff1f9" font-size="25" font-weight="750">休息区 · 三色玫瑰</text><text x="800" y="329" text-anchor="middle" fill="#d7e8d4" font-size="17">lounge (800,350)</text></g><g fill="#d6e8cf" opacity=".8" font-size="16"><text x="25" y="665">森林角落 · 场景局部坐标 (1000 × 700)</text><text x="975" y="665" text-anchor="end">X →</text></g></svg></div>
<div class="btns"><button id="toggleCollision" aria-pressed="false">显示碰撞体定义</button><button id="toggleLabels" aria-pressed="true">隐藏石板编号</button><button id="reload">重新读取资产</button></div><p id="status" class="status muted" aria-live="polite">正在读取石板资产……</p></section>
<section class="panel"><h2>静态校验摘要</h2><div id="metrics" class="grid"><div class="metric">读取中…</div></div></section>
<section class="panel"><h2>重要说明</h2><p class="warn">这是读取 GitHub 资产的静态视觉预览，不是实际 3D 物理引擎。</p><p class="foot">此页面只绘制场景局部坐标中的网格投影和碰撞体定义。它不注册运行时碰撞、不写入 navigation.json、不修改数据库，也不证明 Mia 已经可以实际行走。真实运行时接入需先找到并验证相应的渲染、物理和导航接口。</p><p><a href="./world-scenes/mia-assets/stone-path-forest-to-lounge.json">查看原始 JSON 资产</a> · <a href="./world-scenes/mia-assets/navigation.json">查看现有导航定义</a></p></section>
</main>
<script>
(function(){"use strict";
const assetUrl="./world-scenes/mia-assets/stone-path-forest-to-lounge.json";const $=id=>document.getElementById(id);let data=null,showLabels=true,showColliders=false;
function svgEl(tag,attrs){const el=document.createElementNS("http://www.w3.org/2000/svg",tag);for(const k in attrs)el.setAttribute(k,String(attrs[k]));return el;}
function polygon(points){return points.map(p=>p.join(",")).join(" ");}
function draw(){const slabs=$("slabs"),colliders=$("colliders");slabs.replaceChildren();colliders.replaceChildren();for(const s of data.visual_mesh.slabs){const g=svgEl("g",{}),pts=s.polygon_xy;g.append(svgEl("polygon",{points:polygon(pts),fill:"url(#stone)",stroke:"#c5d3bc","stroke-width":3,"stroke-linejoin":"round"}));g.append(svgEl("polygon",{points:polygon(pts),fill:"url(#moss)",opacity:.85}));const minX=Math.min.apply(null,pts.map(p=>p[0])),maxX=Math.max.apply(null,pts.map(p=>p[0]));if(showLabels){const t=svgEl("text",{x:(minX+maxX)/2,y:355,"text-anchor":"middle","font-size":20,"font-weight":800,fill:"#f3f7e9","paint-order":"stroke","stroke":"#273c2c","stroke-width":4});t.textContent=s.id;g.append(t);}slabs.append(g);}for(const c of data.collision.colliders)colliders.append(svgEl("polygon",{points:polygon(c.polygon_xy)}));colliders.style.display=showColliders?"":"none";$("toggleCollision").setAttribute("aria-pressed",String(showColliders));$("toggleLabels").setAttribute("aria-pressed",String(showLabels));$("toggleLabels").textContent=showLabels?"隐藏石板编号":"显示石板编号";}
function report(){const slabs=data.visual_mesh.slabs,cols=data.collision.colliders,all=slabs.flatMap(s=>s.polygon_xy);const inBounds=all.every(p=>p[0]>=0&&p[0]<=1000&&p[1]>=0&&p[1]<=700);const mat=slabs.every(s=>s.material===data.design.material),thick=slabs.every(s=>Math.abs(s.z_max-s.z_min-data.design.thickness)<1e-9),unique=new Set(slabs.map(s=>s.id)).size===5;const ok=inBounds&&mat&&thick&&unique&&cols.length===slabs.length&&data.coordinate_system==="scene_local";$("status").textContent=(ok?"静态资产校验通过":"静态资产校验存在问题")+"。坐标系："+data.coordinate_system+"；石板 "+slabs.length+" 块；碰撞体定义 "+cols.length+" 个。运行时注册：未验证。";$("status").className="status "+(ok?"good":"warn");const rows=[["坐标系",data.coordinate_system],["起点","("+data.endpoints.start.x+", "+data.endpoints.start.y+")"],["终点","("+data.endpoints.end.x+", "+data.endpoints.end.y+")"],["独立石板",slabs.length+" 块"],["碰撞体定义",cols.length+" 个"],["材质 / 厚度",data.design.material+" / "+data.design.thickness],["顶点边界",inBounds?"通过":"失败"],["运行时物理","未验证"],["导航激活","未验证"]];$("metrics").replaceChildren();for(const row of rows){const el=document.createElement("div");el.className="metric";const strong=document.createElement("strong");strong.textContent=row[1];const label=document.createElement("span");label.className="muted";label.textContent=row[0];el.append(strong,label);$("metrics").append(el);}}
async function load(){$("status").textContent="正在读取资产…";try{const r=await fetch(assetUrl,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);data=await r.json();if(data.scene_id!=="mia-forest-corner"||data.coordinate_system!=="scene_local")throw new Error("场景或坐标系不匹配");draw();report();}catch(e){$("status").textContent="资产读取失败："+e.message+"。请在 GitHub Pages 部署完成后重试。";$("status").className="status warn";}}
$("toggleCollision").addEventListener("click",()=>{showColliders=!showColliders;if(data)draw();});$("toggleLabels").addEventListener("click",()=>{showLabels=!showLabels;if(data)draw();});$("reload").addEventListener("click",load);load();
})();
</script></body></html>
