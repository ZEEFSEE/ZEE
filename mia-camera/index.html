<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>MIA · 浏览器摄像头测试</title>
<style>
:root{color-scheme:dark;font:16px system-ui,"Segoe UI",sans-serif;background:#101820;color:#edf3f6}
body{max-width:780px;margin:28px auto;padding:0 16px}
main{background:#192630;border:1px solid #314653;border-radius:16px;padding:22px}
h1{margin:0 0 8px}p{color:#bdcbd3;line-height:1.55}
video{display:block;width:100%;max-height:440px;min-height:180px;background:#05090c;border-radius:12px;object-fit:contain}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
button{border:0;border-radius:9px;padding:11px 16px;font-weight:650;cursor:pointer;background:#8ad8bc;color:#10221c}
button.secondary{background:#314653;color:#edf3f6}
button:disabled{opacity:.45;cursor:not-allowed}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d151b;padding:12px;border-radius:9px;color:#c8e7dc}
#status{min-height:2em;color:#b8e9d5}
.small{font-size:.88rem}
.notice{border-left:3px solid #d6b56c;padding-left:12px}
</style>
</head>
<body>
<main>
<h1>MIA · 浏览器摄像头第一步</h1>
<p>本页测试本机摄像头权限、单帧本地预览、设备密钥和 Ed25519 持钥证明。<strong>持钥证明不会上传图像、不会启用设备，也不会授予行动权限。</strong></p>
<video id="video" autoplay muted playsinline></video>
<div class="controls">
<button id="start">允许并开启摄像头</button>
<button id="capture" disabled>本地采集单帧</button>
<button id="stop" class="secondary" disabled>关闭摄像头</button>
<button id="keygen" class="secondary">读取/生成本机设备密钥</button>
<button id="prove" class="secondary" disabled>验证本机密钥</button>
<button id="ingress" disabled>采集并安全接入单帧</button>
<button id="understand" class="secondary" disabled>让 MIA 理解最近一帧</button>
</div>
<canvas id="still" hidden></canvas>
<p id="status" role="status">等待你的操作。</p>
<p class="small">设备登记公钥（可分享）；私钥只保存在本浏览器的 IndexedDB 中：</p>
<pre id="device">尚未生成</pre>
<p class="small notice">隐私边界：不录音、不连续录像、不进行人脸识别。持钥证明不上传图像；只有你主动点击“采集并安全接入单帧”时，才会将一张 320×240 JPEG、图像哈希和签名发送到 zee-prediction 的 mia_test 隔离环境。私钥不会离开浏览器。设备与密钥保持禁用，不授予行动权限。</p>
</main>
<script>
const video=document.querySelector("#video");
const still=document.querySelector("#still");
const start=document.querySelector("#start");
const capture=document.querySelector("#capture");
const stop=document.querySelector("#stop");
const keygen=document.querySelector("#keygen");
const prove=document.querySelector("#prove");
const ingress=document.querySelector("#ingress");
const understand=document.querySelector("#understand");
const status=document.querySelector("#status");
const deviceBox=document.querySelector("#device");
const PROOF_URL="https://boaiqnkhrytxwdpgkxti.supabase.co/functions/v1/mia-camera-key-proof-test";
const INGRESS_URL="https://boaiqnkhrytxwdpgkxti.supabase.co/functions/v1/mia-camera-frame-ingress-test";
const UNDERSTAND_URL="https://boaiqnkhrytxwdpgkxti.supabase.co/functions/v1/mia-vision-understanding-test";
const VISION_STORAGE_KEY="mia-camera-last-accepted-observation-v1";
const FRAME_ID="windows-camera-image-plane-v1";
const CAMERA_SOURCE="browser_getusermedia_builtin_webcam";
let stream=null;
let keyReady=false;
let lastAcceptedFrame=null;
try{lastAcceptedFrame=JSON.parse(localStorage.getItem(VISION_STORAGE_KEY)||"null");}catch{lastAcceptedFrame=null;}
understand.disabled=!(keyReady&&lastAcceptedFrame?.observation_id&&lastAcceptedFrame?.image_sha256);

function b64url(bytes){
  let binary="";
  for(const b of bytes) binary+=String.fromCharCode(b);
  return btoa(binary).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function openKeyDb(){
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open("mia-camera-device-v1",1);
    request.onupgradeneeded=()=>request.result.createObjectStore("keys");
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
  });
}
async function saveKeyPair(pair,metadata){
  const db=await openKeyDb();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction("keys","readwrite");
    tx.objectStore("keys").put({privateKey:pair.privateKey,publicKey:pair.publicKey,metadata},"device");
    tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
  });
  db.close();
}
async function loadKeyPair(){
  const db=await openKeyDb();
  const value=await new Promise((resolve,reject)=>{
    const request=db.transaction("keys","readonly").objectStore("keys").get("device");
    request.onsuccess=()=>resolve(request.result||null);
    request.onerror=()=>reject(request.error);
  });
  db.close();return value;
}
async function renderDevice(){
  const existing=await loadKeyPair();
  if(!existing){keyReady=false;prove.disabled=true;return null;}
  const raw=await crypto.subtle.exportKey("raw",existing.publicKey);
  deviceBox.textContent=JSON.stringify({...existing.metadata,public_key_b64url:b64url(new Uint8Array(raw)),private_key:"仅保存在本浏览器 IndexedDB，不可导出"},null,2);
  keyReady=true;prove.disabled=false;ingress.disabled=!(stream&&video.videoWidth);
understand.disabled=!(lastAcceptedFrame?.observation_id&&lastAcceptedFrame?.image_sha256);
  return existing;
}
start.addEventListener("click",async()=>{
  try{
    if(!navigator.mediaDevices?.getUserMedia)throw new Error("需要 HTTPS 或 localhost，并使用支持摄像头的浏览器");
    stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480}},audio:false});
    video.srcObject=stream;
    capture.disabled=false;stop.disabled=false;ingress.disabled=!keyReady;
    status.textContent="摄像头已开启。画面只在本机预览。";
  }catch(e){status.textContent="无法开启摄像头："+(e?.message||String(e));}
});
capture.addEventListener("click",()=>{
  if(!stream||!video.videoWidth)return;
  still.width=video.videoWidth;still.height=video.videoHeight;
  still.getContext("2d",{alpha:false}).drawImage(video,0,0);
  status.textContent="单帧已在本机采集，尚未上传。";
});
stop.addEventListener("click",()=>{
  if(stream)stream.getTracks().forEach(track=>track.stop());
  stream=null;video.srcObject=null;capture.disabled=true;stop.disabled=true;ingress.disabled=true;
  status.textContent="摄像头已关闭。";
});
keygen.addEventListener("click",async()=>{
  keygen.disabled=true;
  try{
    if(!crypto.subtle)throw new Error("当前页面环境不支持 Web Crypto");
    const existing=await loadKeyPair();
    if(existing){
      await renderDevice();
      status.textContent="已读取本机现有设备密钥，没有重新生成。";
      return;
    }
    const pair=await crypto.subtle.generateKey({name:"Ed25519"},false,["sign","verify"]);
    const raw=await crypto.subtle.exportKey("raw",pair.publicKey);
    const metadata={source_id:crypto.randomUUID(),key_id:"browser-ed25519-v1",algorithm:"Ed25519",created_at:new Date().toISOString()};
    await saveKeyPair(pair,metadata);
    await renderDevice();
    status.textContent="本机设备密钥已生成。公钥已登记在隔离测试数据库；设备和密钥仍保持禁用。";
  }catch(e){status.textContent="密钥读取/生成失败："+(e?.message||String(e));}
  finally{keygen.disabled=false;}
});
prove.addEventListener("click",async()=>{
  prove.disabled=true;
  try{
    const pair=await loadKeyPair();
    if(!pair?.privateKey||!pair?.metadata?.source_id)throw new Error("本机设备密钥不存在，请先读取或生成");
    const observedAt=new Date().toISOString();
    const nonceBytes=crypto.getRandomValues(new Uint8Array(24));
    const nonce=b64url(nonceBytes);
    const message=[
      "ZHI-MIA-CAMERA-KEY-PROOF-V1",
      pair.metadata.source_id,
      pair.metadata.key_id,
      observedAt,
      nonce
    ].join("\n");
    const signature=await crypto.subtle.sign({name:"Ed25519"},pair.privateKey,new TextEncoder().encode(message));
    const signature_b64url=b64url(new Uint8Array(signature));
    status.textContent="正在向隔离测试接口提交签名证明（不含图像和私钥）……";
    const response=await fetch(PROOF_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        source_id:pair.metadata.source_id,
        key_id:pair.metadata.key_id,
        observed_at:observedAt,
        nonce,
        signature_b64url
      }),
      cache:"no-store"
    });
    const result=await response.json().catch(()=>({error:"invalid_server_response"}));
    if(!response.ok||result.ok!==true)throw new Error(result.error||("HTTP "+response.status));
    status.textContent="成功：服务器已用登记公钥验证本机私钥签名。设备与密钥仍保持禁用；没有上传图像或写入感知事件。";
    deviceBox.textContent=JSON.stringify({...result,source_id:pair.metadata.source_id,key_id:pair.metadata.key_id},null,2);
  }catch(e){
    status.textContent="持钥验证未通过："+(e?.message||String(e));
  }finally{prove.disabled=!keyReady;}
});

ingress.addEventListener("click",async()=>{
  ingress.disabled=true;
  try{
    const pair=await loadKeyPair();
    if(!pair?.privateKey||!pair?.metadata?.source_id)throw new Error("本机设备密钥不存在，请先读取或生成");
    if(!stream||!video.videoWidth)throw new Error("请先开启摄像头");
    still.width=320;still.height=240;
    still.getContext("2d",{alpha:false}).drawImage(video,0,0,320,240);
    let blob=null;
    for(const quality of [0.78,0.68,0.58,0.48]){
      blob=await new Promise((resolve,reject)=>{
        still.toBlob(value=>value?resolve(value):reject(new Error("JPEG 编码失败")),"image/jpeg",quality);
      });
      if(blob.size<=40*1024)break;
    }
    if(!blob||blob.size>40*1024)throw new Error("单帧 JPEG 无法压缩到 40 KB 以下，请调整光线后重试");
    const imageBytes=new Uint8Array(await blob.arrayBuffer());
    const imageHashBytes=new Uint8Array(await crypto.subtle.digest("SHA-256",imageBytes));
    const imageSha256=Array.from(imageHashBytes,b=>b.toString(16).padStart(2,"0")).join("");
    const imageB64url=b64url(imageBytes);
    const observedAt=new Date().toISOString();
    const nonce=b64url(crypto.getRandomValues(new Uint8Array(24)));
    const eventId=crypto.randomUUID();
    const canonical=[
      "ZHI-MIA-CAMERA-FRAME-V1",
      pair.metadata.source_id,
      pair.metadata.key_id,
      eventId,
      observedAt,
      nonce,
      imageSha256,
      "image/jpeg",
      "320",
      "240",
      FRAME_ID,
      CAMERA_SOURCE,
      "user_initiated_single_frame",
      "image_pixel_center_not_world_coordinates"
    ].join("\n");
    const signature=await crypto.subtle.sign(
      {name:"Ed25519"},pair.privateKey,new TextEncoder().encode(canonical)
    );
    status.textContent="正在将这一张 JPEG、哈希和签名发送到 mia_test 隔离环境……";
    const response=await fetch(INGRESS_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        source_id:pair.metadata.source_id,
        key_id:pair.metadata.key_id,
        event_id:eventId,
        observed_at:observedAt,
        nonce,
        image_b64url:imageB64url,
        image_sha256:imageSha256,
        media_type:"image/jpeg",
        width:320,
        height:240,
        frame_id:FRAME_ID,
        camera_source:CAMERA_SOURCE,
        capture_mode:"user_initiated_single_frame",
        coordinate_semantics:"image_pixel_center_not_world_coordinates",
        signature_b64url:b64url(new Uint8Array(signature))
      }),
      cache:"no-store"
    });
    const result=await response.json().catch(()=>({error:"invalid_server_response"}));
    if(!response.ok||result.ok!==true)throw new Error(result.error||("HTTP "+response.status));
    status.textContent="单帧安全接入成功：图像哈希与设备签名均已验证，事件已写入 mia_test。设备与密钥仍禁用；未启用实时感知、物理测量或行动权限。";
    lastAcceptedFrame={observation_id:result.observation_id,image_sha256:imageSha256,ingress_id:result.ingress_id};
    localStorage.setItem(VISION_STORAGE_KEY,JSON.stringify(lastAcceptedFrame));
    understand.disabled=!keyReady;
    deviceBox.textContent=JSON.stringify(result,null,2);
  }catch(e){
    status.textContent="单帧接入未通过："+(e?.message||String(e));
  }finally{
    ingress.disabled=!(keyReady&&stream&&video.videoWidth);
  }
});


understand.addEventListener("click",async()=>{
  understand.disabled=true;
  try{
    const pair=await loadKeyPair();
    if(!pair?.privateKey||!pair?.metadata?.source_id)throw new Error("本机设备密钥不存在，请先读取");
    if(!lastAcceptedFrame?.observation_id||!lastAcceptedFrame?.image_sha256)throw new Error("尚无已接入的单帧，请先采集并安全接入");
    const signedAt=new Date().toISOString();
    const nonce=b64url(crypto.getRandomValues(new Uint8Array(24)));
    const canonical=[
      "ZHI-MIA-VISION-UNDERSTANDING-V1",
      pair.metadata.source_id,
      pair.metadata.key_id,
      lastAcceptedFrame.observation_id,
      signedAt,
      nonce,
      lastAcceptedFrame.image_sha256
    ].join("\n");
    const signature=await crypto.subtle.sign({name:"Ed25519"},pair.privateKey,new TextEncoder().encode(canonical));
    status.textContent="MIA 正在通过 AGNES 分析已保存的静态图像；不会重新开启摄像头……";
    const response=await fetch(UNDERSTAND_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        observation_id:lastAcceptedFrame.observation_id,
        signed_at:signedAt,
        nonce,
        signature_b64url:b64url(new Uint8Array(signature))
      }),
      cache:"no-store"
    });
    const result=await response.json().catch(()=>({error:"invalid_server_response"}));
    if(!response.ok||result.ok!==true)throw new Error(result.error||("HTTP "+response.status));
    status.textContent="AGNES 视觉理解完成：推断已单独保存到 mia_test.subject_inferences。结果仅描述静态图像，不代表实时感知或世界坐标。";
    deviceBox.textContent=JSON.stringify(result,null,2);
  }catch(e){
    status.textContent="视觉理解未通过："+(e?.message||String(e));
  }finally{understand.disabled=!(keyReady&&lastAcceptedFrame?.observation_id&&lastAcceptedFrame?.image_sha256);}
});

window.addEventListener("pagehide",()=>{if(stream)stream.getTracks().forEach(track=>track.stop());});
renderDevice().catch(e=>{status.textContent="无法读取本机密钥："+(e?.message||String(e));});
</script>
</body>
</html>
