name: Mia Daily Public Diary

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mia-daily-publication
  cancel-in-progress: false

jobs:
  generate-and-stage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Obtain short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mia-daily-publisher")"
          token="$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.value)process.exit(1);process.stdout.write(j.value)})' <<< "$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Generate diary from Mia's private context (server-side)
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          PUBLISH_FUNCTION_URL: https://dbooikzqprnqbgpfwsze.supabase.co/functions/v1/mia-daily-publish
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST "$PUBLISH_FUNCTION_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -o mia/daily.json
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("mia/daily.json","utf8"));if(x.status!=="published"||x.safety_status!=="passed"||!x.diary||!x.theme||!Array.isArray(x.tags))process.exit(1);'

      - name: Run daily diary safety gate
        run: node mia/safety-check.mjs

      - name: Upload the reviewed JSON for the commit job
        uses: actions/upload-artifact@v4
        with:
          name: mia-daily-json
          path: mia/daily.json
          if-no-files-found: error
          retention-days: 2

  commit-reviewed-json:
    needs: generate-and-stage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download reviewed JSON
        uses: actions/download-artifact@v4
        with:
          name: mia-daily-json
          path: reviewed
      - name: Commit only the reviewed public JSON with race-safe retries
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 reviewed/daily.json /tmp/mia-daily-reviewed.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            install -m 0644 /tmp/mia-daily-reviewed.json mia/daily.json
            node mia/safety-check.mjs
            node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("mia/daily.json","utf8"));if(x.status!=="published"||x.safety_status!=="passed"||!x.diary||!x.date)process.exit(1);'
            if git diff --quiet -- mia/daily.json; then
              echo "No public JSON change to commit."
              exit 0
            fi
            git add -- mia/daily.json
            git commit -m "Publish reviewed Mia daily diary"
            if git push origin HEAD:main; then
              echo "Reviewed Mia daily diary published to main."
              exit 0
            fi
            echo "Concurrent main update detected on attempt $attempt; refreshing and retrying."
            sleep "$attempt"
          done
          echo "Could not publish after five attempts; remote files were not force-pushed or overwritten."
          exit 1