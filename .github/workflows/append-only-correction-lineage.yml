name: Verify ZHI append-only correction lineage prototype

on:
  pull_request:
    paths:
      - "mia-digital-family/runtime/append-only-correction-lineage.mjs"
      - "mia-digital-family/tests/append-only-correction-lineage.test.mjs"
      - ".github/workflows/append-only-correction-lineage.yml"
  push:
    branches: ["main"]
    paths:
      - "mia-digital-family/runtime/append-only-correction-lineage.mjs"
      - "mia-digital-family/tests/append-only-correction-lineage.test.mjs"
      - ".github/workflows/append-only-correction-lineage.yml"

permissions:
  contents: read

jobs:
  correction-lineage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify append-only correction and rollback invariants
        run: node --test mia-digital-family/tests/append-only-correction-lineage.test.mjs
