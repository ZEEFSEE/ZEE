<html lang="zh-CN">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{color-scheme:dark;--bg:#0c1019;--panel:#151c29;--panel2:#1b2535;--line:#2a3548;--ink:#edf3fc;--muted:#99a9bf;--mint:#78e0ca;--blue:#8cb7ff;--gold:#f3c87a;--bad:#ff9299}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 12% 0%,#17283a 0,transparent 42%),var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}button,input,textarea{font:inherit}button{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#202b3d;color:var(--ink);cursor:pointer;font-weight:700}button:hover{border-color:#617b9b}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--mint);color:#10221f;border-color:var(--mint)}input,textarea{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:#0e1521;color:var(--ink);outline:none}input:focus,textarea:focus{border-color:var(--mint)}.shell{max-width:1180px;margin:auto;padding:24px 18px 34px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.brand{font-size:24px;font-weight:900;letter-spacing:-.5px}.brand span{color:var(--mint)}.sub{font-size:12px;color:var(--muted);margin-top:3px}.topright{display:flex;gap:8px;align-items:center}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px}.panel{background:#131a27eF;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 18px 55px #0002}.head{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:850}.sidebody{padding:14px}.row{display:flex;gap:8px}.row>*{min-width:0;flex:1}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.groupitem{display:block;width:100%;text-align:left;margin:7px 0;background:transparent;padding:12px}.groupitem.active{border-color:#478f87;background:#19332f}.groupitem strong{display:block}.groupitem small{color:var(--muted)}.chat{min-height:76vh;display:flex;flex-direction:column}.chathead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px 20px;border-bottom:1px solid var(--line)}.title{font-size:19px;font-weight:900}.meta{font-size:12px;color:var(--muted)}.people{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.chip{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--muted)}.chip.mark{color:var(--blue);border-color:#354d73}.chip.jason{color:var(--gold);border-color:#6a5431}.messages{flex:1;min-height:380px;max-height:61vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}.welcome{margin:auto;text-align:center;max-width:450px;color:var(--muted);line-height:1.9;padding:24px}.msg{max-width:86%;border:1px solid var(--line);border-radius:16px;padding:12px 15px;background:#182131;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:#183b37;border-color:#28675e;border-bottom-right-radius:5px}.msg.mark{align-self:flex-start;border-left:3px solid var(--blue);border-bottom-left-radius:5px}.msg.jason{align-self:flex-start;border-left:3px solid var(--gold);border-bottom-left-radius:5px}.who{font-size:11px;font-weight:850;margin-bottom:5px;color:var(--muted)}.msg.mark .who{color:var(--blue)}.msg.jason .who{color:var(--gold)}.msg.mia{align-self:flex-start;border-left:3px solid #c3a2ff;border-bottom-left-radius:5px}.msg.mia .who{color:#d8b7ff}.chip.mia{color:#d8b7ff;border-color:#665080}.time{font-size:10px;color:#7e8da4;margin-top:7px}.composer{padding:14px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:10px}.composer textarea{resize:vertical;min-height:54px;max-height:180px}.status{font-size:12px;color:var(--muted);padding:0 17px 14px;white-space:pre-wrap}.status.error{color:var(--bad)}.status.good{color:var(--mint)}.gate{max-width:430px;margin:10vh auto;padding:26px}.gate h1{margin:0 0 6px}.gate p{color:var(--muted);font-size:13px}.hidden{display:none!important}.tiny{font-size:11px;color:var(--muted);line-height:1.6}.section{font-size:12px;color:var(--muted);margin:18px 0 8px}.notice{border:1px solid #4b4330;background:#282318;border-radius:12px;padding:11px;font-size:12px;color:#e9d8ad;margin-top:12px}
@media(max-width:760px){.shell{padding:12px 8px 22px}.top{align-items:flex-start}.brand{font-size:20px}.layout{display:flex;flex-direction:column}.chat{min-height:0}.messages{height:49dvh;min-height:280px;max-height:none;padding:13px 10px}.msg{max-width:94%;font-size:14px}.chathead{padding:13px}.composer{position:sticky;bottom:0;background:#131a27;grid-template-columns:minmax(0,1fr) 78px;padding:10px;gap:7px}.composer button{padding:8px}.topright button{font-size:12px;padding:8px}.sidebar{order:2}.chat{order:1}.groupitem{display:inline-block;width:100%}}

/* Responsive refinements: desktop width, mobile viewport and safe-area support */
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}body{min-height:100%;min-height:100dvh}.shell{width:100%}.messages,.sidebody{overscroll-behavior:contain}textarea{resize:vertical;overflow-y:auto}.pwa-install{position:fixed;z-index:50;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));width:auto;min-width:0;min-height:32px;padding:6px 10px;border-radius:999px;font-size:11px;line-height:1.2;letter-spacing:.1px;background:#1b2535eF;border-color:#42516a;color:#c9d6e8;box-shadow:0 4px 18px #0004;opacity:.88}.pwa-install:hover{opacity:1;border-color:var(--mint)}.pwa-install:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
@media(min-width:1100px){.shell{padding-top:26px}.layout{grid-template-columns:270px minmax(0,1fr);gap:18px}.chat{min-height:min(820px,calc(100dvh - 150px))}.messages{max-height:calc(100dvh - 360px)}}
@media(max-width:760px){.shell{padding:10px 8px calc(34px + env(safe-area-inset-bottom))}.top{gap:8px;margin-bottom:12px}.topright{flex-shrink:0}.layout{gap:10px}.panel{border-radius:15px}.chat{min-height:calc(100dvh - 105px);min-height:calc(100dvh - 105px - env(safe-area-inset-top))}.messages{height:calc(100dvh - 330px);height:calc(100dvh - 330px - env(safe-area-inset-top));min-height:220px;padding-bottom:18px}.composer{position:sticky;bottom:0;padding-bottom:max(10px,env(safe-area-inset-bottom));z-index:2}.composer textarea{min-height:48px;max-height:130px;padding:10px 11px}.composer button{min-height:44px}.chathead{align-items:flex-start}.title{font-size:17px}.people{gap:4px}.chip{font-size:10px}.pwa-install{left:max(8px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));padding:5px 8px;font-size:10px}.gate{width:calc(100% - 20px);margin:8vh auto;padding:20px}.sidebar .sidebody{padding:10px}}
@media(max-width:380px){.brand{font-size:18px}.sub{max-width:245px}.topright{gap:5px}.topright button{padding:7px 8px}.composer{grid-template-columns:minmax(0,1fr) 68px}.messages{padding-left:8px;padding-right:8px}}

/* Mobile usability and safe-area refinements */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scrollbar-gutter:stable}
body{overflow-x:hidden;min-height:100dvh}
button,input,textarea{touch-action:manipulation}
input,textarea{font-size:16px}
button{min-height:44px}
.messages{min-width:0;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
.msg{min-width:0;overflow-wrap:anywhere;word-break:break-word}
.composer{padding-bottom:max(10px,env(safe-area-inset-bottom))}
@media(max-width:760px){
 .shell{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
 .composer{padding-left:10px;padding-right:10px}
}
@media(max-width:650px){
 .shell{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
 .composer{padding-left:10px;padding-right:10px}
 .chat{min-width:0}
 .chathead{min-width:0}
 .identity{flex-shrink:0}
 .messages{scroll-padding-bottom:12px}
}


/* PWA mobile scroll fix: reserve a viewport-height chat panel and scroll only its transcript. */
@media (max-width: 760px) {
  html, body { height: 100%; min-height: 100%; }
  body { min-height: 100dvh; }
  #app.shell { min-height: 0; }
  #app .layout { min-height: 0; }
  #app .chat {
    height: calc(100dvh - 96px - env(safe-area-inset-top));
    min-height: 0;
    max-height: none;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #app .messages {
    flex: 1 1 0%;
    min-height: 0;
    height: auto;
    max-height: none;
    overflow-x: hidden;
    overflow-y: auto;
    touch-action: pan-y;
    overscroll-behavior-y: contain;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 18px;
  }
  #app .composer {
    position: relative;
    flex: 0 0 auto;
    bottom: auto;
    z-index: 2;
  }
  #app .status { flex: 0 0 auto; }
}
@media (max-width: 380px) {
  #app .chat { height: calc(100dvh - 90px - env(safe-area-inset-top)); }
}

</style>
</head>
<body>
<div id="login" class="panel gate">
 <div class="brand">ZHI <span>·</span> 讨论室</div><h1 style="margin-top:18px">登录三人聊天室</h1>
 <p>请使用现有聊天室账号登录。</p>
 <div class="field"><label for="email">邮箱</label><input id="email" type="email" autocomplete="username" placeholder="name@example.com"></div>
 <div class="field"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" placeholder="Supabase Auth 密码"></div>
 <div class="row"><button id="signIn" class="primary" style="width:100%">登录</button></div>
 <div id="loginStatus" class="status" style="padding:14px 0 0"></div>
 <div class="tiny">无需填写 API Key 或数据库密钥。</div>
</div>
<div id="app" class="shell hidden">
 <header class="top"><div><div class="brand">ZHI <span>·</span> 三人讨论室</div><div class="sub">你、Mark、Jason · 只保留三人群聊</div></div><div class="topright"><button id="refresh">刷新</button><button id="logout">退出</button></div></header>
 <div class="layout">
  <aside class="panel sidebar"><div class="head">讨论会话</div><div class="sidebody">
   <button id="newGroup" class="primary" style="width:100%">＋ 新建三人群聊</button>
   <div class="section">群聊列表</div><div id="groups"><div class="tiny" style="padding:12px 2px">登录后加载会话</div></div>

  </div></aside>
  <main class="panel chat"><div class="chathead"><div><div id="chatTitle" class="title">选择或创建群聊</div><div id="chatMeta" class="meta">Mia 会在识别到明显沟通障碍时尝试主动介入</div><div id="people" class="people"><span class="chip">你</span><span class="chip mark">Mark · 证据与逻辑</span><span class="chip jason">Jason · 创意与执行</span><span class="chip mia">Mia · 沟通协调</span></div></div><span class="chip">三人群聊</span></div>
   <div id="messages" class="messages"><div class="welcome">欢迎来到新的三人讨论室。<br>创建群聊后，你的每条消息都会依次交给 Mark 和 Jason。</div></div>
   <div class="composer"><textarea id="message" placeholder="输入讨论内容…（Enter 发送，Shift+Enter 换行）" maxlength="6000"></textarea><button id="send" class="primary" disabled>发送 ↗</button></div>
   <div id="status" class="status">登录后即可开始。</div>
  </main>
 </div>
</div>
<button id="pwaInstall" class="pwa-install" type="button" aria-label="安装 ZHI 讨论室为应用">↗ 安装</button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=> {
 const URL="https://boaiqnkhrytxwdpgkxti.supabase.co";
 const KEY="sb_publishable_LJgcqXfOdHTEVb7ekz38RQ_c1sM8AUG";
 const API=URL+"/functions/v1/mark-jason-group-chat";
 const $=id=>document.getElementById(id);
 const client=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"zhi-mark-jason-auth-v1"}});
 let session=null,groups=[],groupId=null,busy=false,watcher=null,observeTimer=null,observeBusy=false;
 const status=(s,k="")=>{$("status").textContent=s;$("status").className="status "+k};
 const loginStatus=(s,k="")=>{$("loginStatus").textContent=s;$("loginStatus").className="status "+k};
 async function invoke(payload){
  const {data:{session:s}}=await client.auth.getSession();
  if(!s?.access_token)throw new Error("登录已过期，请重新登录。");
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+s.access_token,"apikey":KEY},body:JSON.stringify(payload),cache:"no-store"});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.ok)throw new Error(d.error||("HTTP "+r.status));
  return d;
 }
 function time(v){return v?new Date(v).toLocaleString("zh-SG",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}):""}
 function bubble(m){
  if(m.id&&$("messages").querySelector(`[data-message-id="${m.id}"]`))return;
  const empty=$("messages").querySelector(".welcome");if(empty)empty.remove();
  const slug=m.sender_slug||m.sender_type;const cls=slug==="user"||m.sender_type==="user"?"user":slug==="mark"?"mark":slug==="jason"?"jason":slug==="mia"?"mia":"agent";
  const el=document.createElement("div");el.className="msg "+cls;if(m.id)el.dataset.messageId=m.id;
  const who=document.createElement("div");who.className="who";who.textContent=m.sender_name||({user:"你",mark:"Mark",jason:"Jason"}[slug]||slug||"系统");
  const content=document.createElement("div");content.textContent=m.content||"";
  const tm=document.createElement("div");tm.className="time";tm.textContent=time(m.created_at);
  el.append(who,content,tm);$("messages").append(el);$("messages").scrollTop=$("messages").scrollHeight;
 }
 function renderGroups(){
  const box=$("groups");box.innerHTML="";
  if(!groups.length){const p=document.createElement("div");p.className="tiny";p.style.padding="12px 2px";p.textContent="还没有群聊，点击上方创建。";box.append(p);return;}
  groups.forEach(g=>{const b=document.createElement("button");b.className="groupitem"+(g.id===groupId?" active":"");b.type="button";const t=document.createElement("strong");t.textContent=g.title||"三人讨论";const sm=document.createElement("small");sm.textContent="你 · Mark · Jason · "+time(g.updated_at||g.created_at);b.append(t,sm);b.onclick=()=>openGroup(g.id);box.append(b)});
 }
 function stopWatching(){if(watcher){client.removeChannel(watcher);watcher=null}if(observeTimer){clearTimeout(observeTimer);observeTimer=null}}
 function watchGroup(id){
  stopWatching();
  if(!session||!id)return;
  watcher=client.channel("mia-live-"+id)
   .on("postgres_changes",{event:"INSERT",schema:"public",table:"chat_messages",filter:"session_id=eq."+id},payload=>{
    if(groupId!==id)return;
    const m=payload.new||{};
    if(m.sender_slug!=="user")bubble(m);
    if(m.sender_slug==="mia")return;
    if(observeTimer)clearTimeout(observeTimer);
    observeTimer=setTimeout(async()=>{
     if(observeBusy||groupId!==id)return;
     observeBusy=true;
     try{const d=await invoke({op:"observe",group_id:id});if(d.response)bubble(d.response)}
     catch(e){console.warn("Mia live observer unavailable",e.message)}
     finally{observeBusy=false}
    },1800);
   }).subscribe();
 }
 async function loadGroups(){
  const d=await invoke({op:"list_groups"});groups=d.groups||[];renderGroups();
  if(groupId&&groups.some(g=>g.id===groupId))return;
  if(groups.length)await openGroup(groups[0].id);
 }
 async function openGroup(id){
  const d=await invoke({op:"history",group_id:id});groupId=id;watchGroup(id);
  $("chatTitle").textContent=d.group?.title||"三人讨论";$("chatMeta").textContent="已恢复 "+(d.messages||[]).length+" 条消息";
  $("messages").innerHTML="";
  if(!(d.messages||[]).length)$("messages").innerHTML='<div class="welcome">群聊已创建。发一条消息开始讨论。</div>';
  (d.messages||[]).forEach(bubble);$("send").disabled=false;renderGroups();status("历史记录已恢复。","good");
 }

 async function createGroup(){
  const title=prompt("给三人群聊取个名字：","Mark · Jason 三人讨论");
  if(title===null)return;
  try{busy=true;$("newGroup").disabled=true;const d=await invoke({op:"create_group",agent_slugs:["mark","jason"],title:title.trim()||"Mark · Jason 三人讨论"});groupId=d.group_id;await loadGroups();await openGroup(groupId);status("三人群聊已创建。","good");}
  catch(e){status("创建失败："+e.message,"error")}
  finally{busy=false;$("newGroup").disabled=false}
 }
 async function sendMessage(){
  if(busy)return;if(!groupId){status("请先创建或打开会话。","error");return}
  const message=$("message").value.trim();if(!message)return;
  busy=true;$("send").disabled=true;$("newGroup").disabled=true;$("message").value="";
  bubble({sender_slug:"user",sender_name:"你",sender_type:"user",content:message,created_at:new Date().toISOString()});status("正在保存消息，并依次等待 Mark、Jason 回应…");
  try{const d=await invoke({op:"send",group_id:groupId,message});(d.responses||[]).forEach(bubble);status("消息和回应已保存。","good");await loadGroups();}
  catch(e){status("发送未完整成功："+e.message+"。如果显示部分保存，请刷新群聊确认已保存内容。","error");try{await openGroup(groupId)}catch(_){}}
  finally{busy=false;$("send").disabled=!groupId;$("newGroup").disabled=false;$("message").focus()}
 }
 async function showSession(s){
  session=s;$("login").classList.toggle("hidden",!!s);$("app").classList.toggle("hidden",!s);
  if(s){try{await loadGroups();status("已登录。选择或创建群聊。","good")}catch(e){status("加载群聊失败："+e.message,"error")}}
 }
 $("signIn").onclick=async()=>{loginStatus("正在登录…");const {data,error}=await client.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error){loginStatus("登录失败："+error.message,"error");return}loginStatus("");await showSession(data.session)};

 $("logout").onclick=async()=>{stopWatching();await client.auth.signOut();session=null;groupId=null;groups=[];await showSession(null)};
 $("refresh").onclick=async()=>{try{await loadGroups();if(groupId)await openGroup(groupId);status("已刷新。","good")}catch(e){status("刷新失败："+e.message,"error")}};
 $("newGroup").onclick=createGroup;$("send").onclick=sendMessage;
 $("message").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});
 client.auth.onAuthStateChange((_event,s)=>{if(s&&!session)showSession(s);else if(!s&&session)showSession(null)});
 client.auth.getSession().then(({data})=>showSession(data.session));

 // Small PWA install affordance; chat itself still requires an online connection.
 let deferredInstallPrompt=null;
 const pwaButton=$("pwaInstall");
 window.addEventListener("beforeinstallprompt",event=>{
  event.preventDefault();deferredInstallPrompt=event;
  if(pwaButton){pwaButton.textContent="↗ 安装";pwaButton.hidden=false;}
 });
 window.addEventListener("appinstalled",()=>{
  deferredInstallPrompt=null;if(pwaButton)pwaButton.hidden=true;
 });
 if(pwaButton){
  pwaButton.addEventListener("click",async()=>{
   if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    try{await deferredInstallPrompt.userChoice}catch(_){}
    deferredInstallPrompt=null;
    return;
   }
   const ua=navigator.userAgent||"";
   if(/iphone|ipad|ipod/i.test(ua)){
    alert("在 Safari 中点“分享”图标，再选择“加入主屏幕”，即可安装 ZHI 讨论室。");
   }else if(/android/i.test(ua)){
    alert("如果浏览器菜单中有“安装应用”或“添加到主屏幕”，请选择它。若暂未出现，请先用 Chrome 打开此网页并保持联网。");
   }else{
    alert("在浏览器地址栏右侧或菜单中选择“安装 ZHI 讨论室”或“创建快捷方式”。");
   }
  });
 }
 if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(err=>console.warn("PWA service worker registration failed",err)));
 }

})();
</script>
</body></html>
