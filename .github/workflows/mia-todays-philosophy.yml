name: Mia Today's Philosophy
# Deployment validation: keep this workflow change scoped to its own publication path.

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/mia-todays-philosophy.yml"

permissions: {}

concurrency:
  group: mia-todays-philosophy
  cancel-in-progress: false

jobs:
  generate-and-stage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Obtain short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mia-todays-philosophy")"
          token="$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.value)process.exit(1);process.stdout.write(j.value)})' <<< "$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Generate philosophy from Mia's private context (server-side)
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          PUBLISH_FUNCTION_URL: https://dbooikzqprnqbgpfwsze.supabase.co/functions/v1/mia-todays-philosophy
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error \
            -X POST "$PUBLISH_FUNCTION_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -o "$response_file" \
            -w '%{http_code}')"
          if [[ "$http_status" != "200" ]]; then
            echo "Mia philosophy publisher returned HTTP $http_status."
            # Print only a short error label, never the full response or private context.
            node - "$response_file" <<'NODE'
          const fs = require("fs");
          try {
            const body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            const raw = typeof body.error === "string" ? body.error : "";
            const safe = raw.length <= 160 && !/[\r\n]/.test(raw) ? raw : "";
            console.error("Publisher error: " + (safe || "No safe short error label returned; response body withheld."));
          } catch {
            console.error("Publisher returned a non-JSON error; response body withheld.");
          }
          NODE
            exit 1
          fi
          cp "$response_file" mia/todays-philosophy.json
          node -e 'const fs=require("fs");const p="mia/todays-philosophy.json";const x=JSON.parse(fs.readFileSync(p,"utf8"));if(x.status!=="published"||x.safety_status!=="passed"||!x.philosophy||!x.reflection||!x.date||!x.generated_at)process.exit(1);if(String(x.philosophy).trim().length<20||String(x.reflection).trim().length<80)process.exit(1);fs.writeFileSync(p,JSON.stringify(x,null,2)+"\n");'

      - name: Run local public-content safety gate
        run: node mia/philosophy-safety-check.mjs

      - name: Upload reviewed philosophy JSON
        uses: actions/upload-artifact@v4
        with:
          name: mia-todays-philosophy-json
          path: mia/todays-philosophy.json
          if-no-files-found: error
          retention-days: 2

  commit-reviewed-json:
    needs: generate-and-stage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download reviewed JSON
        uses: actions/download-artifact@v4
        with:
          name: mia-todays-philosophy-json
          path: reviewed

      - name: Commit only the reviewed public JSON
        shell: bash
        run: |
          set -euo pipefail
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep the reviewed artifact safe while refreshing the moving main branch.
          install -m 0644 reviewed/todays-philosophy.json /tmp/mia-todays-philosophy-reviewed.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            install -m 0644 /tmp/mia-todays-philosophy-reviewed.json mia/todays-philosophy.json
            node -e 'const fs=require("fs");const p="mia/todays-philosophy.json";const x=JSON.parse(fs.readFileSync(p,"utf8"));if(x.status!=="published"||x.safety_status!=="passed"||!x.philosophy||!x.reflection||!x.date||!x.generated_at)process.exit(1);fs.writeFileSync(p,JSON.stringify(x,null,2)+"\n");'
            node mia/philosophy-safety-check.mjs
            if git diff --quiet -- mia/todays-philosophy.json; then
              echo "No public JSON change to commit."
              exit 0
            fi
            git add -- mia/todays-philosophy.json
            git commit -m "Publish Mia today's philosophy"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race detected on attempt $attempt; refreshing main and retrying."
            sleep "$attempt"
          done
          echo "Could not publish philosophy after three attempts; previous remote file remains intact."
          exit 1
  deploy-pages:
    needs: [generate-and-stage, commit-reviewed-json]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest committed main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload latest committed site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy latest committed site
        id: deployment
        uses: actions/deploy-pages@v4

