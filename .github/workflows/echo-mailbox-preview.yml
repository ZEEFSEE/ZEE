name: Echo Mailbox Preview Safety
# Runs offline safety and regression checks for Echo's gated AGNES pipeline.

on:
  pull_request:
    paths:
      - "echo-mailbox/**"
      - "supabase/functions/echo-submit/**"
      - "supabase/functions/_shared/**"
      - "supabase/design/**"
      - "supabase/echo-mailbox/**"
      - ".github/workflows/echo-mailbox-preview.yml"
      - ".github/workflows/pages.yml"
  push:
    branches: ["main", "feature/echo-mailbox-bilingual-mvp", "feature/echo-mailbox-backend-hardening"]
    paths:
      - "echo-mailbox/**"
      - "supabase/functions/echo-submit/**"
      - "supabase/functions/_shared/**"
      - "supabase/design/**"
      - "supabase/echo-mailbox/**"
      - ".github/workflows/echo-mailbox-preview.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

jobs:
  preview-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate bilingual preview and fail-closed backend
        run: node echo-mailbox/tests/validate-preview.mjs
      - name: Run publication gate adversarial tests
        run: node --test echo-mailbox/tests/echo-gate.test.mjs echo-mailbox/tests/echo-schema.test.mjs echo-mailbox/tests/agnes-adapter.test.mjs echo-mailbox/tests/echo-pipeline.test.mjs echo-mailbox/tests/echo-persistence.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check gated Edge Function
        run: deno check supabase/functions/echo-submit/index.ts
      - name: Verify server configuration without processing a submission
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          preflight_status=$(curl --silent --show-error --dump-header /tmp/echo-preflight-headers.txt --output /dev/null --write-out '%{http_code}' \
            --request OPTIONS 'https://dbooikzqprnqbgpfwsze.supabase.co/functions/v1/echo-submit' \
            --header 'Origin: https://zeefsee.github.io' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type')
          if [ "$preflight_status" != "204" ] \
            || ! grep -qi '^access-control-allow-origin: https://zeefsee.github.io' /tmp/echo-preflight-headers.txt \
            || ! grep -qi '^access-control-allow-methods: .*POST' /tmp/echo-preflight-headers.txt \
            || ! grep -qi '^access-control-allow-headers: .*content-type' /tmp/echo-preflight-headers.txt; then
            echo "Echo Mailbox browser CORS preflight failed (HTTP $preflight_status)"
            cat /tmp/echo-preflight-headers.txt
            exit 1
          fi
          status=$(curl --silent --show-error --output /tmp/echo-mailbox-probe.json --write-out '%{http_code}' \
            --request POST 'https://dbooikzqprnqbgpfwsze.supabase.co/functions/v1/echo-submit' \
            --header 'Origin: https://zeefsee.github.io' \
            --header 'Content-Type: application/json' \
            --data-binary '{}')
          if [ "$status" != "400" ]; then
            echo "Echo Mailbox configuration probe expected HTTP 400 after activation checks; received HTTP $status"
            cat /tmp/echo-mailbox-probe.json
            exit 1
          fi
          echo "Activation flags and required server secrets are present. Empty test payload was rejected before persistence or AGNES."
