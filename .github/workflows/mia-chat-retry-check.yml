name: Mia Chat Retry Contract Checks

on:
  pull_request:
    paths:
      - "supabase/functions/mia-chat/index.ts"
      - "tests/mia-chat-retry-contract.test.mjs"
      - ".github/workflows/mia-chat-retry-check.yml"
  push:
    branches:
      - "fix/mia-chat-retry-budget-2026-10-25"
    paths:
      - "supabase/functions/mia-chat/index.ts"
      - "tests/mia-chat-retry-contract.test.mjs"
      - ".github/workflows/mia-chat-retry-check.yml"

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Mia chat TypeScript
        run: deno check supabase/functions/mia-chat/index.ts
      - name: Check retry and stream safety contracts
        run: node --test tests/mia-chat-retry-contract.test.mjs
