<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZHI · 智能人观察窗口</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18202b;background:#f4f6f8}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:22px 16px 40px}
h1{margin:0;font-size:25px}.sub{color:#6b7480;font-size:13px;margin-top:4px}
.status{margin:16px 0;padding:10px 13px;border:1px solid #e1e5ea;border-radius:10px;background:#fff;color:#68727e}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:#fff;border:1px solid #e1e5ea;border-radius:12px;padding:14px}
.name{font-weight:800;font-size:16px}.muted{color:#77818d;font-size:12px}.state{margin-top:8px;font-size:13px}
.activity{margin-top:9px;padding-top:9px;border-top:1px solid #edf0f3;font-size:13px;line-height:1.5}
.reason{margin-top:5px;color:#4f5965;font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#38a169;margin-right:6px}.walk{color:#2563eb}.idle{color:#7a838d}.error{color:#b42318}
.empty{text-align:center;padding:40px;color:#7a838d;background:#fff;border:1px solid #e1e5ea;border-radius:12px}
</style>
</head>
<body>
<main class="wrap">
<header><h1>🔭 ZHI · 智能人观察窗口</h1><div class="sub">只读观察 · 不控制智能人 · 数据来自现有数据库</div></header>
<div id="status" class="status">正在连接观察数据…</div>
<section id="agents" class="grid"></section>
</main>
<script>
const endpoint='https://jozrslgdjreepxplicen.supabase.co/rest/v1/rpc/zhi_observe_agents';
const apiKey='sb_publishable_MOVcpW2XoLdHbUVp6f-nrw_e_HY1Bav';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const dt=v=>v?new Date(v).toLocaleString():'—';
const labels={work:'工作',rest:'休息',adventure:'探索',entertainment_consume:'娱乐',eat:'进食',social:'社交'};
const label=v=>labels[v]||v||'—';
async function load(){
  try{
    const r=await fetch(endpoint,{method:'POST',headers:{'apikey':apiKey,'Content-Type':'application/json'},body:'{}',cache:'no-store'});
    const rows=await r.json().catch(()=>[]);
    if(!r.ok)throw new Error('观察数据读取失败（HTTP '+r.status+'）');
    render(Array.isArray(rows)?rows:[]);
    $("status").textContent='● 实时只读观察 · '+rows.length+' 名智能人 · 更新：'+dt(new Date());
  }catch(e){$("status").innerHTML='<span class="error">观察连接失败：'+esc(e?.message||'未知错误')+'</span>'}
}
function render(rows){
  $("agents").innerHTML=rows.length?rows.map(x=>{
    const alive=String(x.life_status||'').toLowerCase()==='alive', active=x.active===true;
    const state=alive?(active?'<span class="dot"></span>正在活动':'<span class="idle">○ 当前空闲</span>'):'<span class="idle">— '+esc(x.life_status||'未知状态')+'</span>';
    const moving=x.walking===true;
    const activity=label(x.activity_type||x.decision_type);
    const scene=x.current_scene||x.location_name||'位置未记录';
    const destination=x.destination_scene&&x.destination_scene!==scene?' → '+x.destination_scene:'';
    return '<article class="card"><div class="name">'+esc(x.name||'未命名智能人')+'</div><div class="muted">'+esc(x.personality||'未设置性格')+'</div><div class="state">'+state+(moving?' <span class="walk">· 正在前往目的地</span>':'')+'</div><div class="activity"><b>当前活动</b><br>'+esc(activity)+'<br><span class="muted">位置：'+esc(scene)+esc(destination)+' · 决策：'+dt(x.last_activity_at||x.last_decision_at)+'</span>'+(x.reason?'<div class="reason">'+esc(x.reason)+'</div>':'')+'</div></article>';
  }).join(''):'<div class="empty">暂无智能人数据</div>';
}
load();setInterval(()=>{if(document.visibilityState==='visible')load()},5000);
</script>
</body>
</html>
