name: Verify ZHI seven-brain deliberation simulator

on:
  pull_request:
    paths:
      - "mia-digital-family/runtime/seven-brain-deliberation-simulator.mjs"
      - "mia-digital-family/tests/seven-brain-deliberation-simulator.test.mjs"
      - ".github/workflows/seven-brain-deliberation-simulator.yml"
  push:
    branches: ["main"]
    paths:
      - "mia-digital-family/runtime/seven-brain-deliberation-simulator.mjs"
      - "mia-digital-family/tests/seven-brain-deliberation-simulator.test.mjs"
      - ".github/workflows/seven-brain-deliberation-simulator.yml"

permissions:
  contents: read

jobs:
  deliberation-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate seven-participant deliberation and safeguards
        run: node --test mia-digital-family/tests/seven-brain-deliberation-simulator.test.mjs
