name: Mia Prototype Runtime Tests

on:
  push:
    paths:
      - "supabase/functions/mia-forest-autonomy/**"
      - ".github/workflows/mia-forest-autonomy-test.yml"
  pull_request:
    paths:
      - "supabase/functions/mia-forest-autonomy/**"
      - ".github/workflows/mia-forest-autonomy-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run headless runtime contract tests
        run: deno test --allow-env --allow-net supabase/functions/mia-forest-autonomy/index.test.ts
