<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zee知币 · 预测市场</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#1f232c;--text:#eef0f4;--sub:#9aa2b1;--line:#2a2f3a;--yes:#34d399;--no:#f87171;--accent:#7c9bff;--accent2:#a78bfa;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}header{position:sticky;top:0;background:linear-gradient(180deg,var(--bg) 80%,transparent);z-index:5;padding-bottom:8px}.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;gap:10px}.brand{font-weight:700;font-size:18px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-right:7px}.balance{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:600;font-size:14px}.balance b{color:var(--accent);font-size:16px}.link-btn{background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer}.note{font-size:12px;color:var(--sub);background:var(--card2);border-radius:10px;padding:8px 12px;margin:4px 0 16px}h2.section{font-size:14px;color:var(--sub);margin:24px 4px 10px}.market,.lb,.hist,.auth-card{background:var(--card);border:1px solid var(--line);border-radius:16px}.market{padding:16px;margin-bottom:14px}.q{font-weight:600;font-size:15px;margin-bottom:4px}.meta{font-size:12px;color:var(--sub);margin-bottom:12px}.bar{height:8px;border-radius:8px;background:var(--card2);overflow:hidden;display:flex;margin-bottom:10px}.yes{background:var(--yes)}.no{background:var(--no)}.bar .yes,.bar .no{height:100%}.pools{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:12px}.pools .y{color:var(--yes)}.pools .n{color:var(--no)}.row{display:flex;gap:8px}.btn{flex:1;border:0;border-radius:10px;padding:10px;font-weight:600;font-size:14px;cursor:pointer}.btn.yes{background:var(--yes);color:#0b0c0f}.btn.no{background:var(--no);color:#0b0c0f}.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b0c0f}.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}.btn:disabled{opacity:.45}.stakebox{display:none;margin-top:10px;gap:8px}.stakebox.show{display:flex}.stakebox input,.transfer-input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);font-size:14px}.resolved-tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:999px;margin-left:6px}.resolved-tag.yes{background:#34d39926;color:var(--yes)}.resolved-tag.no{background:#f8717126;color:var(--no)}.lb{overflow:hidden}.lb-row{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px}.lb-row:last-child{border:0}.lb-row.me{background:#7c9bff14}.lb-rank{color:var(--sub);width:28px}.lb-name{flex:1}.lb-points{font-weight:700;color:var(--accent)}footer{text-align:center;color:var(--sub);font-size:11px;margin-top:30px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1}.hidden{display:none!important}#authScreen{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}.auth-card{width:100%;max-width:380px;padding:28px 24px}.auth-card h1{font-size:20px;margin:0 0 4px}.sub{color:var(--sub);font-size:13px;margin:0 0 20px}.field{margin-bottom:14px}.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}.field input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px}.auth-error{color:var(--no);font-size:12px;min-height:16px;margin-bottom:8px}.auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--sub)}.hist{overflow:hidden}.hist-row{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px}.hist-row:last-child{border:0}.hist-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card2)}.hist-main{flex:1;min-width:0}.hist-desc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hist-time{color:var(--sub);font-size:11px;margin-top:2px}.hist-amt{font-weight:700}.pos{color:var(--yes)}.neg{color:var(--no)}.hist-empty{padding:20px;text-align:center;color:var(--sub);font-size:13px}
</style></head>
<body>
<div id="authScreen"><div class="auth-card">
<h1><span class="dot"></span>Zee知币</h1><p class="sub" id="authSub">登录账户，开始你的预测之旅</p>
<div class="field"><label>用户名</label><input id="authUsername" placeholder="例如 zee_player"></div>
<div class="field"><label>密码</label><input type="password" id="authPassword" placeholder="至少 6 位"></div>
<div class="auth-error" id="authError"></div><button class="btn primary" style="width:100%" id="authSubmit">登录</button>
<div class="auth-switch"><span id="authSwitchText">还没有账户？</span> <button class="link-btn" id="authSwitchBtn">立即注册</button></div>
<div class="note" style="margin-top:16px">⚠️ 原型演示：账户和 ZEE 余额仅保存在本设备浏览器中，暂无真实资产价值。</div>
</div></div>

<div class="wrap hidden" id="appScreen"><header><div class="topbar"><div class="brand"><span class="dot"></span>Zee知币</div><div><span id="currentUserLabel" style="color:var(--sub);font-size:13px"></span> <button class="link-btn" id="logoutBtn">退出</button></div><div class="balance">余额 <b id="balanceVal">--</b> ZEE</div></div>
<div class="note">预测市场原型：选择「是 / 否」并质押 ZEE。结算后，胜方按池子比例获得奖励。</div></header>
<h2 class="section">公共预测市场</h2><div id="markets"></div>
<h2 class="section">转账</h2><div class="market"><div class="row"><input class="transfer-input" id="transferTo" placeholder="收款用户名"><input class="transfer-input" style="max-width:100px" type="number" min="1" id="transferAmt" placeholder="数量"><button class="btn primary" id="transferBtn">转账</button></div></div>
<h2 class="section">积分排行榜</h2><div class="lb" id="leaderboard"></div>
<h2 class="section">交易 / 预测历史</h2><div class="hist" id="history"></div><footer>Zee知币原型 · ZEE 为演示积分，不代表现实资产</footer></div>
<div class="toast" id="toast"></div>
<script>
const AK='zee-coin-accounts-v2',SK='zee-coin-session-v2',START=1000;
const marketsSeed=()=>[
{id:'m1',q:'英伟达股价本周五收盘是否高于 200 美元？',meta:'股价预测 · 截止本周五 16:00',pool:{yes:620,no:340},status:'open'},
{id:'m2',q:'国足下一场客场比赛能否取胜？',meta:'体育赛事 · 截止比赛开球前',pool:{yes:180,no:540},status:'open'},
{id:'m3',q:'本季度某科技公司是否会发布新款旗舰手机？',meta:'新闻事件 · 截止季度末',pool:{yes:410,no:260},status:'open'},
{id:'m4',q:'上周预测：某新闻事件是否会登上热搜榜首？',meta:'新闻事件 · 已结算',pool:{yes:700,no:300},status:'resolved',result:'yes'}
];
const seedUsers=[['知币大师',4210],['预言家_老王',3870],['AlphaSeeker',3120],['稳健派',2490]];
let accounts=JSON.parse(localStorage.getItem(AK)||'{}'),currentUser=localStorage.getItem(SK)||null,mode='login';
const save=()=>localStorage.setItem(AK,JSON.stringify(accounts));
const hash=s=>{let h=0;for(let c of s)h=(h*31+c.charCodeAt(0))>>>0;return h.toString(16)};
const toast=m=>{let t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)};
function showAuthError(x){document.getElementById('authError').textContent=x||''}
function login(u){currentUser=u;localStorage.setItem(SK,u);document.getElementById('authScreen').classList.add('hidden');document.getElementById('appScreen').classList.remove('hidden');document.getElementById('currentUserLabel').textContent=u;render()}
function submitAuth(){let u=document.getElementById('authUsername').value.trim(),p=document.getElementById('authPassword').value;if(u.length<2||p.length<6)return showAuthError('用户名至少2个字符，密码至少6位');if(mode==='signup'){if(accounts[u])return showAuthError('该用户名已被注册');accounts[u]={passwordHash:hash(p),balance:START,markets:marketsSeed(),stakes:{},history:[{time:Date.now(),type:'signup',desc:'注册奖励',amount:START}]};save();login(u)}else{if(!accounts[u])return showAuthError('账户不存在');if(accounts[u].passwordHash!==hash(p))return showAuthError('密码错误');login(u)}}
function state(){return accounts[currentUser]} function pct(p){let t=p.yes+p.no;return t?{y:p.yes/t*100,n:p.no/t*100}:{y:50,n:50}}
function render(){let s=state();document.getElementById('balanceVal').textContent=s.balance.toLocaleString();let c=document.getElementById('markets');c.innerHTML='';s.markets.forEach(m=>{let p=pct(m.pool),mine=s.stakes[m.id],d=document.createElement('div');d.className='market';d.innerHTML=`<div class="q">${m.q} ${m.status==='resolved'?'<span class="resolved-tag '+m.result+'">已结算 · '+(m.result==='yes'?'是':'否')+'</span>':''}</div><div class="meta">${m.meta}${mine?' · 你已预测 '+mine.amount+' ZEE（'+(mine.side==='yes'?'是':'否')+'）':''}</div><div class="bar"><div class="yes" style="width:${p.y}%"></div><div class="no" style="width:${p.n}%"></div></div><div class="pools"><span class="y">是 ${m.pool.yes} ZEE</span><span class="n">否 ${m.pool.no} ZEE</span></div><div class="row"><button class="btn yes" data-id="${m.id}" data-side="yes" ${m.status!=='open'?'disabled':''}>预测「是」</button><button class="btn no" data-id="${m.id}" data-side="no" ${m.status!=='open'?'disabled':''}>预测「否」</button></div><div class="stakebox" id="stake-${m.id}"><input type="number" min="1" id="amt-${m.id}" placeholder="质押数量"><button class="btn ghost confirm" data-id="${m.id}">确认</button></div>`;c.appendChild(d)});
c.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{c.querySelectorAll('.stakebox').forEach(x=>x.classList.remove('show'));let x=document.getElementById('stake-'+b.dataset.id);x.dataset.side=b.dataset.side;x.classList.add('show')});
c.querySelectorAll('.confirm').forEach(b=>b.onclick=()=>stake(b.dataset.id));renderLeaderboard();renderHistory()}
function stake(id){let s=state(),box=document.getElementById('stake-'+id),amt=parseInt(document.getElementById('amt-'+id).value,10),m=s.markets.find(x=>x.id===id);if(!amt||amt<1)return toast('请输入有效数量');if(amt>s.balance)return toast('余额不足');let side=box.dataset.side;s.balance-=amt;m.pool[side]+=amt;s.stakes[id]={side,amount:(s.stakes[id]?.amount||0)+amt};s.history.unshift({time:Date.now(),type:'stake',desc:'预测「'+(side==='yes'?'是':'否')+'」· '+m.q,amount:-amt});save();render();toast('已质押 '+amt+' ZEE')}
function renderLeaderboard(){let s=state(),a=[...seedUsers,{name:currentUser,points:s.balance,isMe:true}].sort((a,b)=>b.points-a.points);document.getElementById('leaderboard').innerHTML=a.map((u,i)=>'<div class="lb-row '+(u.isMe?'me':'')+'"><span class="lb-rank">#'+(i+1)+'</span><span class="lb-name">'+u.name+'</span><span class="lb-points">'+u.points.toLocaleString()+' ZEE</span></div>').join('')}
function renderHistory(){let a=state().history||[],e=document.getElementById('history');if(!a.length)return e.innerHTML='<div class="hist-empty">暂无记录</div>';e.innerHTML=a.map(h=>'<div class="hist-row"><div class="hist-icon">'+(h.type==='signup'?'🎁':h.type==='stake'?'🎯':h.type==='transfer_in'?'↙️':'↗️')+'</div><div class="hist-main"><div class="hist-desc">'+h.desc+'</div><div class="hist-time">'+new Date(h.time).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})+'</div></div><div class="hist-amt '+(h.amount>0?'pos':'neg')+'">'+(h.amount>0?'+':'')+h.amount.toLocaleString()+'</div></div>').join('')}
function transfer(){let to=document.getElementById('transferTo').value.trim(),amt=parseInt(document.getElementById('transferAmt').value,10),s=state();if(!accounts[to])return toast('该用户不存在');if(to===currentUser)return toast('不能转给自己');if(!amt||amt<1||amt>s.balance)return toast('转账数量无效或余额不足');s.balance-=amt;accounts[to].balance+=amt;s.history.unshift({time:Date.now(),type:'transfer_out',desc:'转账给 '+to,amount:-amt});accounts[to].history.unshift({time:Date.now(),type:'transfer_in',desc:'收到来自 '+currentUser+' 的转账',amount:amt});save();render();toast('转账成功')}
document.getElementById('authSubmit').onclick=submitAuth;document.getElementById('authSwitchBtn').onclick=()=>{mode=mode==='login'?'signup':'login';document.getElementById('authSub').textContent=mode==='login'?'登录账户，开始你的预测之旅':'创建一个新账户';document.getElementById('authSubmit').textContent=mode==='login'?'登录':'注册';document.getElementById('authSwitchText').textContent=mode==='login'?'还没有账户？':'已有账户？';document.getElementById('authSwitchBtn').textContent=mode==='login'?'立即注册':'直接登录'};document.getElementById('logoutBtn').onclick=()=>{localStorage.removeItem(SK);location.reload()};document.getElementById('transferBtn').onclick=transfer;
if(currentUser&&accounts[currentUser])login(currentUser);
</script></body></html>
