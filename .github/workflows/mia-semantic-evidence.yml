name: Mia semantic evidence contracts

on:
  pull_request:
    paths:
      - "supabase/functions/_shared/mia-semantic-evidence.ts"
      - "supabase/functions/mia-semantic-evidence-test/**"
      - ".github/workflows/mia-semantic-evidence.yml"
  push:
    branches:
      - "mia/semantic-action-evidence-v1"
    paths:
      - "supabase/functions/_shared/mia-semantic-evidence.ts"
      - "supabase/functions/mia-semantic-evidence-test/**"
      - ".github/workflows/mia-semantic-evidence.yml"

permissions:
  contents: read

jobs:
  deno-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Run isolated contract tests
        run: deno test --no-check supabase/functions/mia-semantic-evidence-test/index_test.ts
