name: Mia Semantic Action Contract

on:
  pull_request:
    paths:
      - "tests/mia-semantic-action/**"
      - ".github/workflows/mia-semantic-action-contract.yml"
  push:
    branches:
      - "mia/semantic-action-evidence-v1"
    paths:
      - "tests/mia-semantic-action/**"
      - ".github/workflows/mia-semantic-action-contract.yml"

permissions:
  contents: read

jobs:
  deno-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check contract
        run: deno check tests/mia-semantic-action/contract.ts tests/mia-semantic-action/contract_test.ts
      - name: Run isolated contract tests
        run: deno test tests/mia-semantic-action/contract_test.ts
